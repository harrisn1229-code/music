<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ear Training</title>
<meta name="description" content="Scale degrees over a drone: degrees, melodies, singing and hands-free listening. Works offline.">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<!-- Ear Training is one of the apps inside Music, so it installs and works offline through the files one folder up. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../shared/settings.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar">
  <div class="bar-in wrap">
    <a class="icon-btn" id="nav" href="../" aria-label="Music home, all apps"></a>
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><style>.mlt{fill:#fff;stroke:rgb(20 24 44/.1);stroke-width:8}.mll{stroke:#C2570C}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mlt{fill:#000;stroke:rgb(255 255 255/.14)}:root:not([data-theme="light"]) .mll{stroke:#D48955}}:root[data-theme="dark"] .mlt{fill:#000;stroke:rgb(255 255 255/.14)}:root[data-theme="dark"] .mll{stroke:#D48955}</style><rect class="mlt" x="4" y="4" width="504" height="504" rx="110"/><g class="mll" transform="translate(107.5 107.5) scale(12.04)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.5a5 5 0 0 1 10 0c0 2.8-2 4-3 5.2s-1 2.3-1.6 3.3A2.8 2.8 0 0 1 7.5 17"/><path d="M10 10a2 2 0 0 1 4 0c0 1.2-1.2 1.6-1.6 2.6"/></g></svg>
    <h1 class="brand">Ear Training</h1>
    <div class="bar-r">
      <button class="icon-btn" id="b-ai" type="button" data-assistant aria-label="Assistant"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5l1.7 4.8 4.8 1.7-4.8 1.7L9 15.5l-1.7-4.8L2.5 9l4.8-1.7z"/><path d="M15.5 12.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></svg></button>
      <a class="icon-btn" id="b-stats" href="#/stats" aria-label="Stats"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 16V10M10 16V4.500M15 16v-3.800"/></svg></a>
      <a class="icon-btn" id="b-settings" href="#/settings" aria-label="Settings"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6h8M15 6h2M3 14h2M9 14h8"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg></a>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>
<noscript><p class="wrap">Ear Training needs JavaScript turned on.</p></noscript>

<script src="../shared/cloud-config.js"></script>
<script src="../shared/cloud.js"></script>
<script src="../shared/ai.js"></script>
<script src="../shared/feelings.js"></script>
<script src="../shared/assistant.js"></script>
<script src="app.js"></script>
</body>
</html>
