  }

  function renderEditor(){
    const c = cur();
    const root = $("vEdit");
    root.innerHTML = "";

    const head = h("div", "ed-head");
    const title = h("input", "ed-title");
    title.id = "fTitle"; title.placeholder = "Song title"; title.value = c.title;
    title.setAttribute("aria-label", "Song title"); title.autocomplete = "off"; title.enterKeyHint = "next";
    title.addEventListener("input", () => { c.title = title.value; $("navTitle").textContent = c.title.trim() || "Untitled chart"; touch(); });
    title.addEventListener("keydown", (e) => { if (e.key === "Enter"){ e.preventDefault(); artist.focus(); } });
    const artist = h("input", "ed-artist");
    artist.id = "fArtist"; artist.placeholder = "Artist or writer"; artist.value = c.artist;
    artist.setAttribute("aria-label", "Artist"); artist.autocomplete = "off";
    artist.addEventListener("input", () => { c.artist = artist.value; touch(); });
    head.appendChild(title); head.appendChild(artist);
    root.appendChild(head);

    const tools = h("div", "ed-tools");
    const zoom = h("div", "seg sm");
    zoom.setAttribute("role", "group"); zoom.setAttribute("aria-label", "Chord boxes");
    [["bar","Bars"],["beat","Beats"]].forEach(([z, label]) => {
      const b = h("button", "", label);
      b.setAttribute("aria-pressed", String(prefs.zoom === z));
      b.addEventListener("click", () => { if (prefs.zoom === z) return; prefs.zoom = z; savePrefs(); painted = ""; renderEditor(); });
      zoom.appendChild(b);
    });
    tools.appendChild(zoom);
    tools.appendChild(stepper("Bars per line", c.barsPerLine, (d) => {
      c.barsPerLine = clamp(c.barsPerLine + d, 1, 8); touch(); renderEditor();
    }, "bars per line"));
    // Instrumental songs have no lyric lines (any lyrics already typed are kept, just hidden).

    instr.addEventListener("click", () => {

    });
    tools.appendChild(instr);
    root.appendChild(tools);

    c.sections.forEach((sec, si) => root.appendChild(sectionEl(c, sec, si)));

    const add = h("div", "addsec");
    add.appendChild(h("span", "lbl", "Add a section"));
    SECTION_NAMES.forEach((name) => {
      const b = h("button", "chip", name);
      b.addEventListener("click", () => {
        c.sections.push(makeSection(name, c.barsPerLine));
        touch(); renderEditor();
        const secs = document.querySelectorAll(".sec");
        const last = secs[secs.length - 1];
        if (last) last.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
      });
      add.appendChild(b);
    });
    root.appendChild(add);

    const hints = h("ul", "hints");
    hints.innerHTML = prefs.zoom === "bar"
      ? "<li>Type a chord, then <b>return</b> to jump to the next bar.</li><li>Two chords in one box, like <b>D G</b>, split the bar in half.</li><li>Switch to <b>Beats</b> to place chords on exact beats.</li>"
      : "<li>Each box is one beat. <b>Return</b> moves to the next box.</li><li>Leave a beat empty to hold the chord before it.</li>";
    root.appendChild(hints);

  function sectionEl(c, sec, si){
    const beats = beatsPerBar(c);
    const wrap = h("section", "sec");
    wrap.dataset.si = si;

    const head = h("div", "sec-head");
    const name = h("input", "secname");
    name.value = sec.name; name.setAttribute("aria-label", "Section name"); name.autocomplete = "off";
    name.addEventListener("input", () => { sec.name = name.value; touch(); });
    head.appendChild(name);
    head.appendChild(h("span", "barcount", sec.bars.length + (sec.bars.length === 1 ? " bar" : " bars")));

    const rep = h("div", "rep");
    rep.appendChild(h("span", "lbl", "Play"));
    const rMinus = h("button", "", "−"); rMinus.setAttribute("aria-label", "Play " + sec.name + " fewer times");
    const rOut = h("output", "", "×" + (sec.repeat || 1));
    const rPlus = h("button", "", "+"); rPlus.setAttribute("aria-label", "Play " + sec.name + " more times");
    const setRep = (d) => { sec.repeat = clamp((sec.repeat || 1) + d, 1, 16); rOut.textContent = "×" + sec.repeat; touch(); };
    rMinus.addEventListener("click", () => setRep(-1));
    rPlus.addEventListener("click", () => setRep(1));
    rep.appendChild(rMinus); rep.appendChild(rOut); rep.appendChild(rPlus);
    head.appendChild(rep);

    const more = h("button", "iconbtn");
    more.innerHTML = ICON.more;
    more.setAttribute("aria-label", "Options for " + (sec.name || "section"));
    more.addEventListener("click", () => sectionActions(c, sec, si));
    head.appendChild(more);
    wrap.appendChild(head);

    const bpl = clamp(c.barsPerLine || 4, 1, 8);
    const grid = h("div", "bars" + (prefs.zoom === "bar" ? " zo" : ""));
    grid.style.setProperty("--cols", String(bpl));
    grid.style.setProperty("--cols-m", String(Math.min(bpl, 4)));
    grid.style.setProperty("--cols-s", String(Math.min(bpl, 2)));
    sec.bars.forEach((bar, bi) => grid.appendChild(barEl(c, sec, si, bar, bi, beats)));
    wrap.appendChild(grid);

    const row = h("div", "addrow");
    const addBar = h("button", "ghost", "+ Bar");
    addBar.addEventListener("click", () => { sec.bars.push(makeBar()); touch(); renderEditor(); focusBar(si, sec.bars.length - 1); });
    const addLine = h("button", "ghost", "+ " + bpl + (bpl === 1 ? " bar" : " bars"));
    addLine.addEventListener("click", () => {
      for (let i = 0; i < bpl; i++) sec.bars.push(makeBar());
      touch(); renderEditor(); focusBar(si, sec.bars.length - bpl);
    });
    row.appendChild(addBar);
    if (bpl > 1) row.appendChild(addLine);
    wrap.appendChild(row);
    return wrap;
  }

  function sectionActions(c, sec, si){
    actionSheet({
      title: sec.name || "Section",
      items: [
        { label: "Move up", icon: ICON.up, run(){ if (si === 0) return; c.sections.splice(si - 1, 0, c.sections.splice(si, 1)[0]); touch(); renderEditor(); } },
        { label: "Move down", icon: ICON.down, run(){ if (si === c.sections.length - 1) return; c.sections.splice(si + 1, 0, c.sections.splice(si, 1)[0]); touch(); renderEditor(); } },
        { label: "Duplicate section", icon: ICON.dup, run(){ const copy = JSON.parse(JSON.stringify(sec)); copy.id = uid(); c.sections.splice(si + 1, 0, copy); touch(); renderEditor(); } },
        { label: "Delete section", icon: ICON.trash, danger: true, run(){
          if (c.sections.length === 1){ toast("A chart keeps at least one section."); return; }
          stop();
          const removed = c.sections.splice(si, 1)[0];
          touch(); renderEditor();
          toast("Deleted " + (removed.name || "section") + ".", { label: "Undo", run(){ c.sections.splice(si, 0, removed); touch(); if (state.chartId === c.id && prefs.view === "edit") renderEditor(); } });
        } }
      ]
    });
  }

  function nextChordField(input, si){
    const sec = input.closest(".sec");
    const fields = Array.prototype.slice.call(sec.querySelectorAll(".chord"));
    const i = fields.indexOf(input);
    if (i !== -1 && i < fields.length - 1){ fields[i + 1].focus(); return; }
    const c = cur();
    c.sections[si].bars.push(makeBar());
    touch(); renderEditor(); focusBar(si, c.sections[si].bars.length - 1);
  }

  function barEl(c, sec, si, bar, bi, beats){
    const el = h("div", "bar");
    el.dataset.si = si; el.dataset.bi = bi;

    if (prefs.zoom === "bar"){
      const row = h("div", "beats");
      const slot = h("div", "slot");
      const inp = h("input", "chord");
      inp.type = "text"; inp.value = barChordText(bar, beats);
      inp.placeholder = "Bar " + (bi + 1);
      inp.spellcheck = false; inp.autocapitalize = "off"; inp.autocomplete = "off"; inp.enterKeyHint = "next";
      inp.setAttribute("autocorrect", "off");
      inp.setAttribute("aria-label", "Bar " + (bi + 1) + " chords");
      const pips = h("div", "pips");
      pips.setAttribute("aria-hidden", "true");
      for (let i = 0; i < beats; i++){ const p = h("span", "pip"); p.dataset.beat = String(i); pips.appendChild(p); }
      const sync = () => {
        inp.classList.toggle("split", barChordText(bar, beats).indexOf(" ") !== -1);
        pips.querySelectorAll(".pip").forEach((p, i) => p.classList.toggle("ch", !!chordAt(bar, i)));
      };
      inp.addEventListener("input", () => { setBarFromText(bar, inp.value, beats); sync(); touch(); });
      inp.addEventListener("blur", () => { inp.value = barChordText(bar, beats); });
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter"){ e.preventDefault(); nextChordField(inp, si); } });
      sync();
      slot.appendChild(inp); row.appendChild(slot);
      el.appendChild(row); el.appendChild(pips);
    } else {
      const row = h("div", "beats");
      for (let i = 0; i < beats; i++){
        const slot = h("div", "slot");
        slot.dataset.beat = String(i);
        const inp = h("input", "chord");
        inp.type = "text"; inp.value = bar.chords[i] || "";
        inp.placeholder = String(i + 1);
        inp.spellcheck = false; inp.autocapitalize = "off"; inp.autocomplete = "off"; inp.enterKeyHint = "next";
        inp.setAttribute("autocorrect", "off");
        inp.setAttribute("aria-label", "Bar " + (bi + 1) + " beat " + (i + 1) + " chord");
        inp.addEventListener("input", () => { while (bar.chords.length <= i) bar.chords.push(""); bar.chords[i] = inp.value; touch(); });
        inp.addEventListener("keydown", (e) => { if (e.key === "Enter"){ e.preventDefault(); nextChordField(inp, si); } });
        slot.appendChild(inp); row.appendChild(slot);
      }
      el.appendChild(row);

  // degrees maps a root's pitch class to its scale degree (1-7) in the song's key; chords whose

  function colorize(line, degrees){
    let out = "";
    const re = /(\s+)|(\|)|([^\s|]+)/g;
    let m;
    while ((m = re.exec(line)) !== null){
      if (m[1]) out += m[1];
      else if (m[2]) out += '<span class="bl">|</span>';
      else {
        const r = /^([A-G][#b]?)/.exec(m[3]);
        const d = degrees && r ? degrees[PC[r[1]]] : 0;
        out += '<span class="c' + (d ? " d" + d : "") + '">' + esc(m[3]) + "</span>";
      }
    }
    return out;
  }
  function keyDegrees(c){

    const map = {};
    kn.syms.forEach((sym, i) => { const r = /^([A-G][#b]*)/.exec(sym); const pc = r ? PC[r[1]] : undefined; if (pc !== undefined) map[pc] = i + 1; });
    return map;
  }

      for (let i = 0; i < c.top; i++){

        if (ch && !seen[ch] && parseChord(ch)){ seen[ch] = 1; out.push(ch); }
      }
    }));
    return out;
  }

  function keyboardSvg(sym, degrees){
    const ch = parseChord(sym);
    const lit = {};
    if (ch) ch.iv.forEach((i) => { let n = ch.root + i; while (n >= 24) n -= 12; lit[n] = 1; });
    const W = 8, H = 34, BW = 5, BH = 21, WHITE = [0, 2, 4, 5, 7, 9, 11], BLACK = { 1: 0, 3: 1, 6: 3, 8: 4, 10: 5 };
    const w = 14 * W + 1;
    let s = '<svg class="kb' + (degrees ? " deg" : "") + '" width="' + w + '" height="' + (H + 1) + '" viewBox="0 0 ' + w + " " + (H + 1) + '" aria-hidden="true">';
    for (let o = 0; o < 2; o++) WHITE.forEach((pc, k) => {
      s += '<rect class="kw' + (lit[o * 12 + pc] ? " on" : "") + '" x="' + (0.5 + (o * 7 + k) * W) + '" y=".5" width="' + W + '" height="' + H + '" rx="1.5"/>';
    });
    for (let o = 0; o < 2; o++) Object.keys(BLACK).forEach((pc) => {
      const x = 0.5 + (o * 7 + BLACK[pc] + 1) * W - BW / 2;
      s += '<rect class="kk' + (lit[o * 12 + (+pc)] ? " on" : "") + '" x="' + x + '" y=".5" width="' + BW + '" height="' + BH + '" rx="1"/>';
    });

      // A dot on each lit key in its degree colour (a filled key can't show white or black).
      const dot = (n, cx, cy, r) => { const d = degrees[n % 12]; s += '<circle class="kd' + (d ? " d" + d : "") + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>'; };

  // Reads a chord symbol into a root, a bass note and the intervals above the root, in semitones.
  // Covers triads, 6, 7, 9, 11, 13, sus, add, dim, aug, half-diminished, altered notes and slash bass.
  function parseChord(sym){
    const m = /^([A-G])([#b]?)([^\/]*)(?:\/([A-G])([#b]?))?$/.exec(String(sym || "").trim().replace("6/9", "69"));
    if (!m) return null;
    const root = PC[m[1] + m[2]];
    const bass = m[4] ? PC[m[4] + (m[5] || "")] : root;
    if (root === undefined || bass === undefined) return null;
    let q = m[3].replace(/[\s()]/g, "");
    if (q === "5") return { root: root, bass: bass, iv: [0, 7] };
    let third = 4, fifth = 7, sev = null, k;
    const ext = [];
    // 9 adds the 9th; 11 adds 9 and 11; 13 adds 9 and 13 (the 11th is left out, as players do).
    const addExt = (n) => { n = +n; if (n >= 9) ext.push(14); if (n === 11) ext.push(17); if (n >= 13) ext.push(21); };
    const MAJ = /^([Mm]aj|ma(?=\d)|M|Δ|△)(7|9|11|13)?/;
    if (!MAJ.test(q) && /^(min|mi|m|-)/.test(q)){ third = 3; q = q.replace(/^(min|mi|m|-)/, ""); }
    if (/^(dim|°|o)/.test(q)){ third = 3; fifth = 6; if (/^(dim|°|o)7/.test(q)) sev = 9; q = q.replace(/^(dim|°|o)7?/, ""); }
    else if (/^[øØ]/.test(q)){ third = 3; fifth = 6; sev = 10; q = q.replace(/^[øØ]7?/, ""); }
    else if (/^(aug|\+)/.test(q)){ fifth = 8; q = q.replace(/^(aug|\+)/, ""); }
    if ((k = MAJ.exec(q))){ if (k[2] || /[Δ△]/.test(k[1])) sev = 11; if (k[2]) addExt(k[2]); q = q.slice(k[0].length); }
    else if ((k = /^(7|9|11|13)/.exec(q))){ if (sev === null) sev = 10; addExt(k[1]); q = q.slice(k[0].length); }
    else if ((k = /^6(9)?/.exec(q))){ ext.push(9); if (k[1]) ext.push(14); q = q.slice(k[0].length); }
    else if ((k = /^2/.exec(q))){ ext.push(14); q = q.slice(1); }
    if (/sus2/.test(q)) third = 2; else if (/sus/.test(q)) third = 5;
    if (/add(9|2)/.test(q)) ext.push(14);
    if (/add(11|4)/.test(q)) ext.push(17);
    if (/b5|-5/.test(q)) fifth = 6;
    if (/#5|\+5/.test(q)) fifth = 8;
    const alter = (re, from, to) => {

    if (!sc.editing || !sc.sel || !b || !p) return;
    const v = b.voices.findIndex((x) => x.p === p && x.s === sc.staff);
    const items = v === -1 ? null : b.cache[v][sc.sel.m];
    if (!items) return;
    const evs = staffEvents(b.bars[sc.sel.m].bar, p, sc.staff, false);
    const n = items.findIndex((it) => sc.sel.idx < evs.length ? it.idx === sc.sel.idx : it.filler);
    if (n === -1) return;
    const el = out.querySelector(".abcjs-v" + v + ".abcjs-mm" + sc.sel.m + ".abcjs-n" + n);
    if (!el) return;
    el.classList.add("sel");
    const r = el.getBoundingClientRect(), pal = $("dock").getBoundingClientRect();
    if (r.top < 120 || r.bottom > pal.top - 12) el.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
  }
  function auditionNotes(notes, p){
    if (INSTRUMENTS[p.inst].kind === "drums" || !ensureCtx()) return;
    try {
      if (!setupPiano()) return;
      const t = ctx.currentTime + 0.02, tr = INSTRUMENTS[p.inst].t;
      pianoRelease(t);
      notes.forEach((n, j) => piano.voices.push(pianoNote(toMidi(n) - tr, t + j * 0.01, 0.14)));
    } catch(e){}
  }

  /* ---------- note entry ---------- */
  function selEvents(create){
    const p = curPart(), b = sc.built;
    if (!p || !b || !sc.sel) return null;
    return staffEvents(b.bars[sc.sel.m].bar, p, sc.staff, create);
  }
  const curDur = () => sc.dot && sc.dur > 1 ? sc.dur * 1.5 : sc.dur;
  function freeIn(evs, except){
    const c = cur();
    return barLen16(c) - evs.reduce((a, ev, i) => a + (i === except ? 0 : ev.d), 0);
  }
  function moveSel(dir){
    const p = curPart(), b = sc.built;
    if (!p || !b || !sc.sel) return;
    const c = cur(), evs = staffEvents(b.bars[sc.sel.m].bar, p, sc.staff, false);
    if (dir > 0){
      const hasRoom = freeIn(evs, -1) > 0;
      if (sc.sel.idx < evs.length - 1 || (sc.sel.idx === evs.length - 1 && hasRoom)) sc.sel.idx++;
      else if (sc.sel.m < b.bars.length - 1) sc.sel = { m: sc.sel.m + 1, idx: 0 };
    } else {
      if (sc.sel.idx > 0) sc.sel.idx--;
      else if (sc.sel.m > 0){
        const pe = staffEvents(b.bars[sc.sel.m - 1].bar, p, sc.staff, false);
        sc.sel = { m: sc.sel.m - 1, idx: freeIn(pe, -1) > 0 ? pe.length : Math.max(0, pe.length - 1) };
      }
    }
    if (c) normSel();
    highlightSel(); syncPalette();
  }
  function edited(advance){
    touch();
    if (advance) { const p = curPart(); if (p){ const evs = selEvents(false); if (sc.sel.idx < evs.length) sc.sel.idx++; } }
    drawScore(); syncPalette();
  }
  function enterNote(pitch){
    const p = curPart();
    if (!p || !sc.sel) return;
    let evs = selEvents(true);
    if (sc.sel.idx < evs.length){
      const ev = evs[sc.sel.idx];
      if (sc.stack && ev.k.length){ if (!ev.k.some((x) => toMidi(x) === toMidi(pitch))) ev.k.push(pitch); }
      else ev.k = [pitch];
      auditionNotes(ev.k, p);
      edited(!sc.stack);
      return;
    }
    let free = freeIn(evs, -1);
    if (free <= 0){
      if (sc.sel.m >= sc.built.bars.length - 1){ toast("This is the last bar. Add bars on the Edit tab."); return; }
      sc.sel = { m: sc.sel.m + 1, idx: 0 };
      evs = selEvents(true);
      if (evs.length){ normSel(); highlightSel(); return enterNote(pitch); }
      free = freeIn(evs, -1);
    }
    evs.push({ k: [pitch], d: fitDur(Math.min(curDur(), free)) });
    auditionNotes([pitch], p);
    if (sc.stack) sc.sel.idx = evs.length - 1;
    else sc.sel.idx = evs.length;
    edited(false);
  }
  function keyPitch(pc){
    const p = curPart();
    return spell((sc.oct + 1) * 12 + pc, partKey(cur(), p));
  }
  function cmd(name, arg){
    const p = curPart();
    if (!p || !sc.sel) return;
    const evs = selEvents(true);
    const ev = sc.sel.idx < evs.length ? evs[sc.sel.idx] : null;
    switch (name){
      case "dur": {
        if (arg === "dot"){ sc.dot = !sc.dot; if (sc.dur === 1) sc.dot = false; }
        else { sc.dur = arg; if (arg === 1) sc.dot = false; }
        if (ev){ ev.d = fitDur(Math.min(curDur(), freeIn(evs, sc.sel.idx))); edited(false); } else syncPalette();
        return;
      }
      case "rest": {
        if (ev){ ev.k = []; edited(true); return; }
        const free = freeIn(evs, -1);
        if (free <= 0){ moveSel(1); return; }
        evs.push({ k: [], d: fitDur(Math.min(curDur(), free)) }); sc.sel.idx = evs.length; edited(false);
        return;
      }
      case "acc": {
        if (!ev || !ev.k.length) { toast("Select a note first."); return; }
        ev.k = ev.k.map((n) => [n[0], n[1], arg === 0 ? 0 : clamp(n[2] + arg, -2, 2)]);
        auditionNotes(ev.k, p); edited(false);
        return;
      }
      case "oct": {
        if (ev && ev.k.length){ ev.k = ev.k.map((n) => [n[0], clamp(n[1] + arg, 0, 8), n[2]]); auditionNotes(ev.k, p); edited(false); return; }
        sc.oct = clamp(sc.oct + arg, 1, 7); syncPalette();
        return;
      }
      case "tie": { if (!ev || !ev.k.length){ toast("Select a note first."); return; } ev.t = ev.t ? 0 : 1; if (!ev.t) delete ev.t; edited(false); return; }
      case "stack": { sc.stack = !sc.stack; syncPalette(); return; }
      case "insert": {
        const free = freeIn(evs, -1);
        if (!ev){ cmd("rest"); return; }
        if (free <= 0){ toast("This bar is full. Shorten or delete a note to make room."); return; }
        evs.splice(sc.sel.idx, 0, { k: [], d: fitDur(Math.min(curDur(), free)) }); edited(false);
        return;
      }
      case "del": {
        if (ev) evs.splice(sc.sel.idx, 1);
        else if (evs.length){ evs.pop(); sc.sel.idx = evs.length; }
        else { moveSel(-1); return; }
        edited(false);
        return;
      }
    }
  }

  const DUR_ICONS = {
    16: '<ellipse cx="11" cy="15" rx="5" ry="3.6" fill="none" stroke="currentColor" stroke-width="1.8"/>',
    8: '<ellipse cx="9" cy="16" rx="4.4" ry="3.2" fill="none" stroke="currentColor" stroke-width="1.7" transform="rotate(-20 9 16)"/><path d="M13 15V3" stroke="currentColor" stroke-width="1.6"/>',
    4: '<ellipse cx="9" cy="16" rx="4.4" ry="3.2" fill="currentColor" transform="rotate(-20 9 16)"/><path d="M13 15V3" stroke="currentColor" stroke-width="1.6"/>',
    2: '<ellipse cx="8" cy="16" rx="4.4" ry="3.2" fill="currentColor" transform="rotate(-20 8 16)"/><path d="M12 15V3c0 3 5 4 5 8" fill="none" stroke="currentColor" stroke-width="1.6"/>',
    1: '<ellipse cx="8" cy="16" rx="4.4" ry="3.2" fill="currentColor" transform="rotate(-20 8 16)"/><path d="M12 15V3c0 3 5 3.5 5 7M12 7c0 3 5 3.5 5 7" fill="none" stroke="currentColor" stroke-width="1.6"/>'
  };
  const DUR_NAMES = { 16: "Whole note", 8: "Half note", 4: "Quarter note", 2: "Eighth note", 1: "Sixteenth note" };
  function pk(label, aria, fn, cls){
    const b = h("button", "pk" + (cls ? " " + cls : ""));
    if (label.charAt(0) === "<") b.innerHTML = label; else b.textContent = label;
    b.setAttribute("aria-label", aria);
    b.addEventListener("click", fn);
    return b;
  }
  function renderPalette(){
    const pal = $("pal"), p = curPart();
    const show = state.screen === "chart" && prefs.view === "score" && sc.editing && !!p;
    pal.hidden = !show;
    document.body.classList.toggle("pal-open", show);
    if (!show) return;
    const c = cur(), I = INSTRUMENTS[p.inst], staves = partStaves(p);
    pal.innerHTML = "";
    const head = h("div", "pal-head");
    head.appendChild(h("b", "", partName(c, p)));
    if (staves.length > 1){
      const seg = h("div", "pal-seg");
      ["Right hand", "Left hand"].forEach((l, s) => {
        const b = h("button", "", s ? "LH" : "RH");
        b.setAttribute("aria-label", l); b.dataset.staff = String(s);
        b.addEventListener("click", () => { sc.staff = s; sc.oct = defaultOct(staves[s]); if (sc.sel) sc.sel.idx = 0; normSel(); highlightSel(); syncPalette(); });
        seg.appendChild(b);
      });
      head.appendChild(seg);
    }
    head.appendChild(h("span", "sp", ""));
    head.appendChild(pk("⌫", "Delete", () => cmd("del"), "nav"));
    head.appendChild(pk("◀", "Previous note", () => moveSel(-1), "nav"));
    head.appendChild(pk("▶", "Next note", () => moveSel(1), "nav"));
    head.appendChild(pk("Done", "Stop editing notes", () => { sc.editing = false; renderScore(); }, "done"));
    pal.appendChild(head);

    const r1 = h("div", "pal-row");
    [16, 8, 4, 2, 1].forEach((d) => {
      const b = pk('<svg width="22" height="22" viewBox="0 0 22 22">' + DUR_ICONS[d] + "</svg>", DUR_NAMES[d], () => cmd("dur", d), "dur");
      b.dataset.d = String(d);
      r1.appendChild(b);
    });
    const dot = pk("•", "Dotted", () => cmd("dur", "dot"), "dot"); dot.id = "pDot"; r1.appendChild(dot);
    r1.appendChild(pk("Rest", "Rest", () => cmd("rest")));
    const tie = pk("Tie", "Tie to the next note", () => cmd("tie")); tie.id = "pTie"; r1.appendChild(tie);
    pal.appendChild(r1);

    const r2 = h("div", "pal-row");
    if (I.kind !== "drums"){
      r2.appendChild(pk("♭", "Flat", () => cmd("acc", -1)));
      r2.appendChild(pk("♮", "Natural", () => cmd("acc", 0)));
      r2.appendChild(pk("♯", "Sharp", () => cmd("acc", 1)));
      r2.appendChild(pk("−8", "Octave down", () => cmd("oct", -1)));
      const ol = h("span", "pal-oct"); ol.id = "pOct"; r2.appendChild(ol);
      r2.appendChild(pk("+8", "Octave up", () => cmd("oct", 1)));
    }
    const st = pk("Chord", "Stack notes into a chord", () => cmd("stack")); st.id = "pStack"; r2.appendChild(st);
    r2.appendChild(pk("Ins", "Insert a rest before the selected note", () => cmd("insert")));
    pal.appendChild(r2);

    if (I.kind === "drums"){
      const pads = h("div", "pads");
      DRUM_PADS.forEach(([name, pitch]) => {
        const b = h("button", "pad", name);
        b.addEventListener("click", () => enterNote(pitch.slice()));
        pads.appendChild(b);
      });
      pal.appendChild(pads);
    } else {
      const kb = h("div", "kbd");
      kb.setAttribute("role", "group"); kb.setAttribute("aria-label", "Keyboard");
      const W = 100 / 8;
      [0, 2, 4, 5, 7, 9, 11, 12].forEach((pc, i) => {
        const b = h("button", "w", i === 0 || i === 7 ? "C" : "");
        b.style.left = (i * W) + "%"; b.style.width = W + "%";
        b.setAttribute("aria-label", LETTERS[NAT.indexOf(pc % 12)] + (pc === 12 ? " (next octave)" : ""));
        b.addEventListener("click", () => enterNote(pc === 12 ? (() => { sc.oct++; const x = keyPitch(0); sc.oct--; return x; })() : keyPitch(pc)));
        kb.appendChild(b);
      });
      [[1, 0], [3, 1], [6, 3], [8, 4], [10, 5]].forEach(([pc, i]) => {
        const b = h("button", "b");
        b.style.left = ((i + 1) * W - W * 0.31) + "%"; b.style.width = (W * 0.62) + "%";
        b.setAttribute("aria-label", pretty(SHARPS[pc]) + " / " + pretty(FLATS[pc]));
        b.addEventListener("click", () => enterNote(keyPitch(pc)));
        kb.appendChild(b);
      });
      pal.appendChild(kb);
    }
    syncPalette();
  }
  function syncPalette(){
    const pal = $("pal");
    if (!pal || pal.hidden) return;
    const evs = selEvents(false) || [];
    const ev = sc.sel && sc.sel.idx < evs.length ? evs[sc.sel.idx] : null;
    if (ev){ const base = ev.d % 3 === 0 && ev.d > 2 ? ev.d / 1.5 : ev.d; if ([16, 8, 4, 2, 1].indexOf(base) !== -1){ sc.dur = base; sc.dot = base !== ev.d; } }
    pal.querySelectorAll(".pk.dur").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.d === sc.dur)));
    $("pDot").setAttribute("aria-pressed", String(sc.dot));
    $("pTie").setAttribute("aria-pressed", String(!!(ev && ev.t)));
    $("pStack").setAttribute("aria-pressed", String(sc.stack));
    const o = $("pOct"); if (o) o.textContent = "C" + sc.oct;
    pal.querySelectorAll(".pal-seg button").forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.staff === sc.staff)));
  }

  /* ---------- parts ---------- */
  function pickInstrument(title, onPick){
    openSheet((body) => {
      const card = h("div", "bsheet-card");
      const head = h("div", "bsheet-head"); head.appendChild(h("div", "bsheet-title", title)); card.appendChild(head);
      const g = h("div", "inst-grid sheet");
      INST_ORDER.forEach((id) => {
        const b = h("button", "inst");
        b.appendChild(h("b", "", INSTRUMENTS[id].name));
        b.appendChild(h("span", "", INSTRUMENTS[id].hint));
        b.addEventListener("click", () => { closeSheet(); onPick(id); });
        g.appendChild(b);
      });
      card.appendChild(g);
      body.appendChild(card);
      const cancel = h("button", "bsheet-cancel", "Cancel");
      cancel.addEventListener("click", closeSheet);
      body.appendChild(cancel);
    });
  }
  function addPart(id){
    const c = cur();
    const p = { id: uid(), inst: id, clef: INSTRUMENTS[id].clefs[0] };
    c.parts.push(p);
    sc.part = p.id; sc.staff = 0; sc.sel = null; sc.editing = false;
    touch(); renderScore();
    setTimeout(() => actionSheet({ title: "Start the " + partName(c, p) + " part with", items: [
      { label: "Notes from the chords", icon: ICON.note20, run(){ fillPart(c, p); touch(); renderScore(); } },
      { label: "An empty staff to write in", icon: ICON.edit, run(){ sc.editing = true; sc.sel = { m: 0, idx: 0 }; sc.oct = defaultOct(partStaves(p)[0]); renderScore(); } }
    ] }), 300);
  }
  function askFill(p){
    const c = cur();
    const go = () => { fillPart(c, p); touch(); sc.sel = sc.editing ? { m: 0, idx: 0 } : null; renderScore(); toast("Filled " + partName(c, p) + " from the chords."); };
    if (!partHasNotes(c, p)){ go(); return; }
    actionSheet({ title: "Replace the notes in " + partName(c, p) + "?", message: "This writes a new part from the chords over what's there now.", items: [
      { label: "Replace with notes from the chords", icon: ICON.note20, danger: true, run: go }
    ] });
  }
  function shareAbc(p){
    const c = cur();
    const parts = p ? [p] : c.parts;
    const text = scoreAbc(c, parts, !p, 4, true).abc;
    const name = slug(c.title) + (p ? "-" + slug(partName(c, p)) : "-score") + ".abc";
    shareFile(name, text, "text/plain").then((r) => { if (r === "saved") toast("Saved " + name); });
  }
  function partActions(p){
    const c = cur();
    actionSheet({ title: partName(c, p), items: [
      { label: "Change instrument", icon: ICON.note20, run: () => setTimeout(() => pickInstrument("Change " + partName(c, p) + " to", (id) => {
        p.inst = id; p.clef = INSTRUMENTS[id].clefs[0]; sc.staff = 0; sc.sel = null; touch(); renderScore();
      }), 280) },
      { label: "Clear all notes", icon: ICON.x20, run(){
        const undo = clearPart(c, p); touch(); renderScore();
        toast("Cleared " + partName(c, p) + ".", { label: "Undo", run(){ undo(); touch(); if (cur() === c && prefs.view === "score") renderScore(); } });
      } },
      { label: "Print or save as PDF", icon: ICON.save, run: () => setTimeout(printScore, 300) },
      { label: "Share as ABC notation", icon: ICON.share, run: () => shareAbc(p) },
      { label: "Delete part", icon: ICON.trash, danger: true, run(){
        const i = c.parts.indexOf(p), undo = clearPart(c, p), name = partName(c, p);
        c.parts.splice(i, 1); sc.part = null; sc.editing = false; touch(); renderScore();
        toast("Deleted " + name + ".", { label: "Undo", run(){ c.parts.splice(i, 0, p); undo(); sc.part = p.id; touch(); if (cur() === c && prefs.view === "score") renderScore(); } });
      } }
    ] });
  }

  /* ============================ keyboard + typing ============================ */
  const isField = (t) => t && t.matches && t.matches("input:not([type=range]):not([type=file]),textarea:not([readonly]),select");
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !$("bsheet").hidden){ closeSheet(); return; }
    if (state.screen !== "chart") return;
    if (e.code === "Space" && !isField(e.target) && !(e.target && e.target.closest && e.target.closest("button"))){
      e.preventDefault();
      state.playing ? stop() : play();
    }
  });
  // On phones, tuck the transport away while the keyboard is up so it never covers a field.
  if (coarse){
    document.addEventListener("focusin", (e) => {
      if (isField(e.target) && !e.target.closest(".dock")) document.body.classList.add("typing");
    });
    document.addEventListener("focusout", () => {
      setTimeout(() => {
        const a = document.activeElement;
        if (!isField(a) || (a.closest && a.closest(".dock"))) document.body.classList.remove("typing");
      }, 80);
    });
  }

  /* ============================ boot ============================ */
  loadCharts();
  loadFolders();
  route();
  $("syncLine").addEventListener("click", () => syncNow());
  if (syncOn()) queueSync(600);
  // The saved sign-in is read a moment after the page starts, and signing in or out can happen in
  // another tool; sync follows the account as soon as it is known.
  if (cloudReady()){
    self.MusicCloud.ready.then(() => { if (cloud()){ queueSync(300); if (state.screen === "lib") renderLibrary(); } });
    self.MusicCloud.onChange(() => { if (cloud()) queueSync(300); if (state.screen === "lib") renderLibrary(); });
  }
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")){
    window.addEventListener("load", () => { navigator.serviceWorker.register("../sw.js").catch(() => {}); });
  }
})();
</script>
</body>
</html>
