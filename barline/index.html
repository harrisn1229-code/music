<script>
  /* Look and feel from Settings: applied before first paint so there's no flash.
     data-scheme = light|dark (resolved), data-accent = accent palette, data-font = title font. */
  window.barlineLook = function(p){
    p = p || {};
    var r = document.documentElement;
    var dark = p.theme === "dark" || (p.theme !== "light" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    r.setAttribute("data-scheme", dark ? "dark" : "light");
    if (p.accent && p.accent !== "teal") r.setAttribute("data-accent", p.accent); else r.removeAttribute("data-accent");
    // Sans is the default title font; lookV marks prefs saved after the redesign.
    if (p.titleFont === "serif" && p.lookV >= 2) r.setAttribute("data-font", "serif"); else r.removeAttribute("data-font");
    var bar = dark ? "#16181B" : "#FFFFFF";
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", bar);
  };
  (function(){
    var p = {};
    try { p = JSON.parse(localStorage.getItem("barline:prefs") || "{}") || {}; } catch(e){}
    window.barlineLook(p);
  })();
</script>

    --disp:var(--ui);
    color-scheme:light;
  }
  /* Dark theme: data-scheme is set in <head> from Settings (System follows the device). */
  :root[data-scheme="dark"]{
    --paper:#0B0C0E; --surface:#16181B; --surface-2:#212429; --sunk:#08090B;
    --ink:#EDEFF2; --muted:#A3A9B3; --faint:#6C727D;
    --rule:#262A30; --rule-strong:#383D45;
    --chord:#4FD1BE; --chord-soft:#11302C;
    --accent-fill:#2DD4BF; --on-accent:#03211D;
    --beat:#FFB547; --beat-soft:#33260F;
    --danger:#F08A73;
    --dock:#111316; --dock-2:#1E2126; --dock-3:#2A2E34; --dock-line:rgba(255,255,255,.08);
    --toast-bg:#EDEFF2; --toast-ink:#121417; --toast-act:#9A4A06;
    --scrim:rgba(0,0,0,.6);
    --shadow:none;
    color-scheme:dark;
  }

  /* Accent palettes. Matched on any element so Settings swatches can preview them. */
  [data-accent="teal"]{--chord:#0F766E;--chord-soft:#DDF1EE;--accent-fill:#0F766E;--on-accent:#FFFFFF;--logo:#0F766E}
  [data-accent="blue"]{--chord:#1D5BC9;--chord-soft:#E0E9FB;--accent-fill:#1D5BC9;--on-accent:#FFFFFF;--logo:#1D5BC9}
  [data-accent="violet"]{--chord:#6A3DC2;--chord-soft:#ECE4FA;--accent-fill:#6A3DC2;--on-accent:#FFFFFF;--logo:#6A3DC2}
  [data-accent="graphite"]{--chord:#2A2F36;--chord-soft:#E5E8EC;--accent-fill:#2A2F36;--on-accent:#FFFFFF;--logo:#2A2F36}
  :root[data-scheme="dark"][data-accent="teal"],:root[data-scheme="dark"] [data-accent="teal"]{--chord:#4FD1BE;--chord-soft:#11302C;--accent-fill:#2DD4BF;--on-accent:#03211D}
  :root[data-scheme="dark"][data-accent="blue"],:root[data-scheme="dark"] [data-accent="blue"]{--chord:#82B1FF;--chord-soft:#152844;--accent-fill:#5C9BFF;--on-accent:#04132B}
  :root[data-scheme="dark"][data-accent="violet"],:root[data-scheme="dark"] [data-accent="violet"]{--chord:#C3A6FF;--chord-soft:#2A2044;--accent-fill:#A987FA;--on-accent:#160A30}
  :root[data-scheme="dark"][data-accent="graphite"],:root[data-scheme="dark"] [data-accent="graphite"]{--chord:#E3E6EA;--chord-soft:#2A2E35;--accent-fill:#E3E6EA;--on-accent:#121417;--kb-lit:#8E96A3}
  :root[data-font="serif"]{--disp:var(--serif)}

  /* Music: fade between the home screen and this app instead of a hard page flash. */
  @media (prefers-reduced-motion: no-preference){ @view-transition{navigation:auto} }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font:16px/1.4 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    --toast-bottom:calc(92px + env(safe-area-inset-bottom,0px));
  }
  body.on-chart{--toast-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  input,select,textarea{font:inherit;color:inherit}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--beat);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{max-width:1040px;margin:0 auto}
  .lbl{font-size:12.5px;color:var(--muted)}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);
    background:var(--surface);
    background:color-mix(in srgb,var(--surface) 86%,transparent);
    -webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px);
    border-bottom:.5px solid var(--rule);
  }
  .nav{display:flex;align-items:center;gap:6px;height:50px}
  .nav-side{flex:0 0 92px;display:flex;align-items:center}
  .nav-side.end{justify-content:flex-end}
  .navtitle{flex:1;min-width:0;text-align:center;font-weight:600;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .back{display:flex;align-items:center;gap:1px;height:40px;padding:0 10px 0 2px;margin-left:-8px;color:var(--chord);font-size:16.5px;border-radius:12px}
  .iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--chord);flex:none}
  .back:active,.iconbtn:active{background:var(--surface-2)}
  .brandrow{display:flex;align-items:center;gap:10px;height:54px}
  .brandrow .home{margin:0 -4px 0 -10px;text-decoration:none}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--logo);display:grid;place-items:center;flex:none}
  .appname{flex:1;font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.015em}
  .search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;margin-bottom:10px;background:var(--surface-2);border-radius:11px;color:var(--faint)}
  .search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
  .search input::placeholder{color:var(--faint)}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none}

  /* ---------- segmented controls ---------- */
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:var(--surface-2);border-radius:11px}
  .seg button{height:32px;padding:0 12px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
  .seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.13),0 0 0 .5px rgba(0,0,0,.05)}
  .seg.sm button{height:28px;font-size:13px}
  .segbar{padding-block:0 10px}
  .segbar .seg{max-width:420px;margin:0 auto}

  .stepper{display:flex;align-items:center;gap:2px;height:34px;padding:0 3px 0 12px;background:var(--surface-2);border-radius:11px}
  .stepper .lbl{margin-right:6px;white-space:nowrap}
  .stepper button{min-width:30px;height:28px;padding:0 6px;border-radius:8px;font-size:18px;line-height:1;color:var(--ink)}
  .stepper button:active{background:var(--sunk)}
  .stepper output{min-width:20px;text-align:center;font-family:var(--mono);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
  .stepper .fit{font-size:13px;font-weight:500;color:var(--muted)}
  .stepper .fit[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  /* ---------- library ---------- */
  .lib-main{padding-block:8px calc(112px + env(safe-area-inset-bottom,0px))}
  .lib-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 4px}
  .lib-head h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .lib-head span{font-size:12.5px;color:var(--faint)}
  .lib-head-r{display:flex;align-items:center;gap:4px}
  .lib-head .iconbtn{width:34px;height:28px;border-radius:8px;color:var(--muted)}
  .folders{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:0 16px 10px;scrollbar-width:none}
  .folders::-webkit-scrollbar{display:none}
  .fchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;background:var(--surface-2);font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
  .fchip .n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  .fchip[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}
  .fchip[aria-pressed="true"] .n{color:inherit;opacity:.75}
  .fchip.add{background:none;box-shadow:inset 0 0 0 1px var(--rule-strong);padding:0 12px 0 9px}
  .fchip svg{width:16px;height:16px}
  .card-tag{flex:none;max-width:38%;padding:1px 7px;border-radius:6px;background:var(--surface-2);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cards{display:flex;flex-direction:column;background:var(--surface);border:.5px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .card{position:relative;display:flex;align-items:center}
  .card + .card::before{content:"";position:absolute;top:0;left:74px;right:0;border-top:.5px solid var(--rule)}
  .card-open{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 2px 12px 14px;text-align:left}
  .card-open:active{background:var(--surface-2)}
  .card-art{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--chord-soft);color:var(--chord);font-family:var(--mono);font-weight:600;font-size:16px;letter-spacing:-.03em}
  .card-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .card-top{display:flex;align-items:baseline;gap:10px}
  .card-title{flex:1;min-width:0;font-family:var(--disp);font-weight:600;font-size:16.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-time{font-size:12.5px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
  .card-sub{display:block;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-peek{display:block;margin-top:3px;font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--chord);white-space:pre;overflow:hidden;text-overflow:ellipsis}
  .bl{color:var(--rule-strong);font-weight:400}
  .card-more{margin-right:4px;color:var(--faint)}
  .lib-foot{margin:22px 0 0;text-align:center;font-size:12.5px;color:var(--faint)}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:48px 12px}
  .empty h2{margin:10px 0 0;font-family:var(--disp);font-size:22px;font-weight:600}
  .empty p{margin:0 0 12px;color:var(--muted);max-width:30ch}
  .empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;background:var(--surface-2);font-size:15px;font-weight:500;white-space:nowrap}
  .btn:active{background:var(--sunk)}
  .btn.pri{background:var(--accent-fill);color:var(--on-accent);font-weight:600}
  .btn.pri:active{opacity:.85}
  .install{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:12px;background:var(--chord-soft);border-radius:16px}
  .install img{width:42px;height:42px;border-radius:10px;flex:none}
  .install .txt{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
  .install .txt b{display:block;color:var(--ink);font-size:14.5px}
  .install .btn{height:34px;padding:0 13px;font-size:14px}
  .install .x{color:var(--muted)}
  .fab{
    position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));
    display:flex;align-items:center;gap:8px;height:54px;padding:0 20px 0 16px;border-radius:27px;
    background:var(--accent-fill);color:var(--on-accent);font-weight:600;font-size:16px;
    box-shadow:0 10px 26px rgba(20,82,74,.32),0 2px 6px rgba(0,0,0,.14);
    box-shadow:0 10px 26px color-mix(in srgb,var(--accent-fill) 32%,transparent),0 2px 6px rgba(0,0,0,.14);transition:transform .2s ease
  }
  .fab:active{transform:scale(.96)}

  /* ---------- chart screen ---------- */
  .chart-main{padding-block:18px calc(150px + env(safe-area-inset-bottom,0px))}
  .ed-head{display:flex;flex-direction:column;margin-bottom:12px}
  .ed-title{width:100%;min-width:0;font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.015em;line-height:1.15;border:0;background:none;padding:2px 6px;margin-left:-6px;border-radius:9px}
  .ed-artist{width:100%;min-width:0;font-size:16px;color:var(--muted);border:0;background:none;padding:3px 6px;margin-left:-6px;border-radius:8px}
  .ed-title::placeholder{color:var(--faint);font-style:italic}
  .ed-artist::placeholder{color:var(--faint)}
  .ed-title:focus,.ed-artist:focus{outline:none;background:var(--surface-2)}
  .ed-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}

  .sec{margin-bottom:22px}
  .sec-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .secname{flex:0 1 auto;width:13ch;min-width:0;font-family:var(--mono);font-weight:600;font-size:15px;border:0;background:none;padding:5px 6px;margin-left:-6px;border-radius:8px}
  .secname:focus{outline:none;background:var(--surface-2)}
  .barcount{font-size:12px;color:var(--faint);white-space:nowrap;margin-right:auto}
  .rep{display:flex;align-items:center;height:32px;padding:0 2px 0 10px;background:var(--surface-2);border-radius:10px}
  .rep .lbl{font-size:12px;margin-right:2px;white-space:nowrap}
  .rep output{min-width:28px;text-align:center;font-family:var(--mono);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
  .rep button{width:28px;height:28px;border-radius:8px;font-size:17px;line-height:1}
  .rep button:active{background:var(--sunk)}
  .sec-head .iconbtn{width:36px;height:36px;color:var(--muted)}

  .bars{
    display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
    background:var(--surface);border:.5px solid var(--rule-strong);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)
  }
  .bar{position:relative;min-width:0;padding:7px 7px 5px;box-shadow:-1px 0 0 var(--rule-strong),0 -1px 0 var(--rule)}
  .bar.act{background:var(--beat-soft)}
  .bar.act::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--beat)}
  .beats{display:flex;gap:2px}
  .slot{position:relative;flex:1 1 0;min-width:0}
  .chord{width:100%;min-width:0;border:0;background:none;font-family:var(--mono);font-weight:600;font-size:15px;color:var(--chord);padding:5px 2px;text-align:center;border-radius:7px}
  .chord::placeholder{color:var(--faint);font-weight:400;font-size:12px}
  .chord:focus{outline:none;background:var(--chord-soft)}
  .slot.bt::after{content:"";position:absolute;left:14%;right:14%;bottom:-1px;height:2px;background:var(--beat);border-radius:1px}
  .bars.zo .chord{text-align:left;font-size:17px;padding:5px 4px}
  .bars.zo .chord.split{font-size:13.5px}
  .bars.zo .chord::placeholder{font-family:var(--ui);font-size:12px}
  .pips{display:flex;gap:3px;padding:3px 4px 6px}
  .pip{flex:1 1 0;height:3px;border-radius:2px;background:var(--rule)}
  .pip.ch{background:var(--chord);opacity:.5}
  .pip.on{background:var(--beat);opacity:1}
  .lyric{width:100%;min-width:0;border:0;border-top:1px dotted var(--rule);border-radius:0;background:none;font-family:var(--mono);font-size:13px;padding:6px 3px 3px}
  .lyric::placeholder{color:transparent}
  .bar:focus-within .lyric::placeholder{color:var(--faint)}
  .lyric:focus{outline:none;background:var(--surface-2)}
  .barx{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--faint);background:var(--surface);opacity:0;pointer-events:none;transition:opacity .15s .25s}
  .bar:focus-within .barx{opacity:1;pointer-events:auto;transition-delay:0s}
  @media (hover:hover){.bar:hover .barx{opacity:1;pointer-events:auto;transition-delay:0s}}
  .barx:hover,.barx:active{background:var(--danger);color:#fff}
  @media (max-width:600px){
    .bars.zo{grid-template-columns:repeat(var(--cols-m,4),minmax(0,1fr))}
    .bars:not(.zo){grid-template-columns:repeat(var(--cols-s,2),minmax(0,1fr))}
  }
  @media (max-width:370px){.bars:not(.zo){grid-template-columns:1fr}}

  .addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .ghost{height:34px;padding:0 14px;border-radius:10px;border:1px dashed var(--rule-strong);font-size:13.5px;color:var(--muted)}
  .ghost:active{border-style:solid;background:var(--surface)}
  .addsec{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:26px;padding-top:18px;border-top:.5px solid var(--rule)}
  .addsec .lbl{width:100%;margin-bottom:2px}
  .chip{height:34px;padding:0 14px;border-radius:17px;background:var(--surface);border:.5px solid var(--rule);font-size:14px;color:var(--ink)}
  .chip:active{background:var(--chord-soft);color:var(--chord)}
  .hints{margin:22px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--faint)}
  .hints b{color:var(--muted);font-weight:600}

  /* chart view: song header, chord bank, then the sheet */
  .song-head{margin:2px 0 18px}
  .song-head h1{margin:0;font-family:var(--disp);font-size:clamp(25px,6.4vw,34px);font-weight:700;letter-spacing:-.022em;line-height:1.12;text-wrap:balance}
  .song-head .by{margin:4px 0 0;font-size:16px;font-weight:500;color:var(--chord)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
  .meta div{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;background:var(--surface-2);font-size:13px}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
  .bank{margin-bottom:18px}
  /* notes in the key, coloured by scale degree */
  .keynotes{margin-bottom:18px}
  .kn-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .kn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 6px;border-radius:11px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
  .kn b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.2;letter-spacing:-.03em}
  .kn:active{filter:brightness(.88)}
  .kn small{font-size:11px;font-weight:600;opacity:.8}
  .kn.d1{background:#F5C518;color:#1A1400}
  .kn.d2{background:#111214;color:#F4F5F7}
  .kn.d3{background:#2563EB;color:#fff}
  .kn.d4{background:#FFFFFF;color:#111214}
  .kn.d5{background:#16A34A;color:#fff}
  .kn.d6{background:#7C3AED;color:#fff}
  .kn.d7{background:#EC4899;color:#fff}
  .bank-head{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
  .bank-head b{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .bank-head span{font-size:12.5px;color:var(--faint)}
  .bank-row{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  .bank-row::-webkit-scrollbar{display:none}
  .kchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 10px 10px;border-radius:12px;background:var(--surface);border:.5px solid var(--rule);box-shadow:var(--shadow);transition:box-shadow .15s,border-color .15s}
  .kchip b{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--chord)}
  .kchip:active{background:var(--surface-2)}
  .kchip.on{border-color:var(--beat);box-shadow:0 0 0 1.5px var(--beat)}
  .kb{display:block}
  .kb .kw{fill:#FBFBFC;stroke:#B4BAC3;stroke-width:1}
  .kb .kk{fill:#23262B}
  .kb .on{fill:var(--kb-lit,var(--accent-fill))}
  /* with a key set, lit keys go pale and carry a dot in their scale-degree colour */
  .kb.deg .kw.on{fill:#DDE3EA}
  .kb.deg .kk.on{fill:#4A515C}
  .kb .kd{fill:var(--accent-fill);stroke:rgba(0,0,0,.55);stroke-width:.8}
  .kb .kd.d1{fill:#F5C518}.kb .kd.d2{fill:#111214;stroke:#fff}.kb .kd.d3{fill:#2563EB}.kb .kd.d4{fill:#FFFFFF}
  .kb .kd.d5{fill:#16A34A}.kb .kd.d6{fill:#7C3AED}.kb .kd.d7{fill:#EC4899}
  .kchip b[class^="d"]{padding:1px 6px;border-radius:5px}
  .kchip b.d1{background:#F5C518;color:#1A1400}.kchip b.d2{background:#111214;color:#F4F5F7}.kchip b.d3{background:#2563EB;color:#fff}
  .kchip b.d4{background:#fff;color:#111214;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5)}.kchip b.d5{background:#16A34A;color:#fff}
  .kchip b.d6{background:#7C3AED;color:#fff}.kchip b.d7{background:#EC4899;color:#fff}
  .viewbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:14px}
  .page{--cfs:14px;padding-top:16px;border-top:.5px solid var(--rule)}
  /* two columns for long charts: lines never split, section names stay with their first line */
  .page.two{column-count:2;column-gap:28px;column-rule:.5px solid var(--rule)}
  .page.two .tapnote{column-span:all}
  .page.two .cline{break-inside:avoid}
  .page.two .csec-name{break-after:avoid}
  .page.two .csec{margin-bottom:16px}
  .csec{margin-bottom:20px}
  .csec-name{display:block;margin:0 0 6px -8px;padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--muted);text-align:left}
  .csec-name:active{background:var(--surface-2)}
  .tapnote{margin:0 0 12px;font-size:12.5px;color:var(--faint)}
  .cline{margin-left:-8px;padding:1px 8px;border-radius:6px;border-left:3px solid transparent;overflow-x:auto;cursor:pointer;touch-action:manipulation}
  .cline:active{background:var(--surface-2)}
  @media (hover:hover){.cline:hover,.csec-name:hover{background:var(--surface-2)}}
  .cline.act{background:var(--beat-soft);border-left-color:var(--beat)}
  .cline pre{margin:0;font-family:var(--mono);font-size:var(--cfs);line-height:1.65;white-space:pre;font-variant-ligatures:none}
  .cline .c{color:var(--chord);font-weight:600;background:var(--chord-soft);box-shadow:0 0 0 2px var(--chord-soft);border-radius:2px}
  /* chords in the key, coloured by the scale degree of their root (same colours as the key strip) */
  .cline .c.d1{background:#F5C518;color:#1A1400;box-shadow:0 0 0 2px #F5C518}
  .cline .c.d2{background:#111214;color:#F4F5F7;box-shadow:0 0 0 2px #111214,0 0 0 3px rgba(127,127,127,.45)}
  .cline .c.d3{background:#2563EB;color:#fff;box-shadow:0 0 0 2px #2563EB}
  .cline .c.d4{background:#FFFFFF;color:#111214;box-shadow:0 0 0 2px #FFFFFF,0 0 0 3px rgba(127,127,127,.45)}
  .cline .c.d5{background:#16A34A;color:#fff;box-shadow:0 0 0 2px #16A34A}
  .cline .c.d6{background:#7C3AED;color:#fff;box-shadow:0 0 0 2px #7C3AED}
  .cline .c.d7{background:#EC4899;color:#fff;box-shadow:0 0 0 2px #EC4899}

  /* text view */
  .txtactions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .txtout{
    display:block;width:100%;min-height:200px;resize:none;margin:0;padding:16px;
    background:var(--surface);border:.5px solid var(--rule);border-radius:16px;
    font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre;overflow-x:auto;overflow-y:hidden;font-variant-ligatures:none
  }
  .txtout:focus{outline:none;border-color:var(--chord)}
  .note{margin-top:10px;font-size:12.5px;color:var(--faint)}
  .toggle{height:40px;padding:0 14px;border-radius:12px;background:var(--surface-2);font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
  .toggle[aria-pressed="true"]{background:var(--beat-soft);color:var(--beat);font-weight:600}

  /* ---------- transport dock (dark in both themes) ---------- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:30;color-scheme:dark;
    background:var(--dock);color:var(--dock-ink);
    border-top:1px solid var(--dock-line);box-shadow:0 -10px 30px rgba(0,0,0,.14);
    padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px));
    transition:transform .22s cubic-bezier(.2,.8,.2,1)
  }
  body.typing .dock,body.typing .fab{transform:translateY(calc(100% + 40px))}
  .dock-in{max-width:720px;margin:0 auto}
  .dock-main{display:flex;align-items:center;gap:8px;padding:9px 8px}
  .play{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--lcd);color:var(--dock);transition:transform .08s ease}
  .play:active{transform:scale(.94)}
  .play svg{margin-left:3px}
  .play.on{background:var(--dock-ink)}
  .play.on svg{margin-left:0}
  .lcd{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:54px;padding:0 13px;background:var(--dock-2);border-radius:13px}
  .lcd-l{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .lcd-chord{flex:0 1 auto;min-width:0;max-width:58%;font-family:var(--mono);font-weight:600;font-size:21px;color:var(--dock-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lcd-chord:empty{display:none}
  .lcd-pos{font-family:var(--mono);font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--lcd);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lcd-sub{font-size:11px;letter-spacing:.04em;color:var(--dock-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tempo{display:flex;align-items:center;height:54px;padding:0 3px;background:var(--dock-2);border-radius:13px;flex:none}
  .tempo-val{display:flex;flex-direction:column;align-items:center;line-height:1}
  .num{background:none;border:0;text-align:center;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
  .num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .tempo .num{width:44px;font-size:19px;color:var(--dock-ink);padding:0}
  .tempo .unit{font-size:10.5px;color:var(--dock-mute);margin-top:3px}
  .dock .step{width:30px;height:42px;border-radius:9px;display:grid;place-items:center;font-size:20px;line-height:1;color:var(--dock-mute)}
  .dock .step:active{background:var(--dock-3);color:var(--dock-ink)}
  .morebtn{width:46px;height:54px;border-radius:13px;display:grid;place-items:center;color:var(--dock-mute);flex:none}
  .morebtn:active,.morebtn[aria-expanded="true"]{background:var(--dock-2);color:var(--dock-ink)}
  .dock-more{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:1px solid var(--dock-line)}
  .field{display:flex;align-items:center;gap:4px;height:42px;padding:0 6px 0 12px;background:var(--dock-2);border-radius:12px}
  .field .flbl{font-size:12px;color:var(--dock-mute);margin-right:6px}
  .field .step{height:32px}
  .meter{display:flex;align-items:center;font-family:var(--mono);font-weight:600;font-size:15px}
  .meter select{background:none;border:0;font-family:var(--mono);font-weight:600;font-size:16px;color:var(--dock-ink);padding:0 3px;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:center}
  .meter .slash{color:var(--dock-mute)}
  .keyf{width:54px;background:none;border:0;font-family:var(--mono);font-weight:600;font-size:16px;text-align:center;color:var(--dock-ink)}
  .keyf::placeholder{color:var(--dock-mute)}
  .vol{width:120px;accent-color:var(--lcd);margin-right:6px}
  .dtoggles{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .dtoggle{height:36px;padding:0 14px;border-radius:18px;background:var(--dock-2);color:var(--dock-mute);font-size:13.5px;font-weight:500}
  .dtoggle[aria-pressed="true"]{background:var(--lcd-soft);color:var(--lcd)}
  @media (max-width:390px){
    .dock-main{gap:6px;padding:8px}
    .play,.lcd,.tempo,.morebtn{height:50px}
    .play{width:50px}
    .lcd{padding:0 10px}
    .lcd-pos{font-size:20px}
    .lcd-chord{font-size:18px}
    .morebtn{width:40px}
    .dock .step{width:26px}
  }

  /* ---------- bottom sheet + toast ---------- */
  .scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);opacity:0;transition:opacity .22s}
  body.sheet-open .scrim{opacity:1}
  .bsheet{
    position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1)
  }
  body.sheet-open .bsheet{transform:none}
  .bsheet-card{background:var(--surface);border-radius:18px;overflow:hidden}
  .bsheet-head{padding:14px 18px 12px;text-align:center}
  .bsheet-title{font-weight:600;font-size:15px}
  .bsheet-msg{margin-top:3px;font-size:13.5px;color:var(--muted)}
  .bsheet-item{display:flex;align-items:center;gap:13px;width:100%;height:56px;padding:0 18px;font-size:17px;border-top:.5px solid var(--rule);text-align:left}
  .bsheet-card > .bsheet-item:first-child{border-top:0}
  .bsheet-item svg{color:var(--chord);flex:none}
  .bsheet-item.danger,.bsheet-item.danger svg{color:var(--danger)}
  .bsheet-item:active{background:var(--surface-2)}
  .bsheet-cancel{display:block;width:100%;height:56px;margin-top:8px;border-radius:18px;background:var(--surface);font-weight:600;font-size:17px;color:var(--chord)}
  .bsheet-cancel:active{background:var(--surface-2)}
  .bsheet-cancel.pri{background:var(--accent-fill);color:var(--on-accent)}
  .bsheet-cancel.pri:active{opacity:.85}
  .bsheet-item .chk{margin-left:auto;display:grid;color:var(--chord)}
  /* Sheets with a text field open from the top so the phone keyboard can't cover them. */
  .bsheet.top{top:0;bottom:auto;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;transform:translateY(-105%)}
  body.sheet-open .bsheet.top{transform:none}
  .name-in{display:block;width:calc(100% - 36px);height:46px;margin:0 18px 16px;padding:0 13px;border:1px solid var(--rule-strong);border-radius:11px;background:var(--surface-2);font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
  .name-in:focus{outline:none;border-color:var(--chord)}
  .set-row{display:flex;flex-direction:column;gap:9px;padding:14px 18px 16px;border-top:.5px solid var(--rule)}
  .set-row .lbl{font-size:13px;font-weight:500}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;padding:4px 2px;border-radius:12px;font-size:12.5px;color:var(--muted)}
  .swatch .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-fill);color:var(--on-accent);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12)}
  .swatch .dot svg{opacity:0}
  .swatch[aria-pressed="true"]{color:var(--ink);font-weight:600}
  .swatch[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent-fill)}
  .swatch[aria-pressed="true"] .dot svg{opacity:1}
  .set-preview{display:flex;align-items:baseline;gap:10px;font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.01em}
  .set-preview .c{font-family:var(--mono);font-size:14px;color:var(--chord)}
  .toast{
    position:fixed;left:50%;bottom:var(--toast-bottom);z-index:60;transform:translateX(-50%);
    display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);
    padding:12px 14px 12px 16px;border-radius:14px;background:var(--toast-bg);color:var(--toast-ink);font-size:14.5px;
    box-shadow:0 10px 28px rgba(0,0,0,.28);animation:toastIn .2s ease
  }
  .toast button{color:var(--toast-act);font-weight:700;padding:2px 2px}
  /* ---------- sync ---------- */
  .sync-line{display:block;margin:4px auto 0;padding:4px 10px;border-radius:8px;font-size:12.5px;color:var(--faint);text-align:center}
  .sync-line.err{color:var(--danger)}
  .sync-steps{margin:0 0 12px;padding-left:20px;font-size:13.5px;line-height:1.5;color:var(--muted)}
  .sync-steps b{color:var(--ink)}
  .sync-link{margin:0 0 12px;color:var(--chord);text-decoration:none}
  .sync-btns{display:flex;flex:none;gap:6px}
  /* ---------- AI assistant ---------- */
  .ai-body{padding:0 18px 14px}
  .ai-note{margin:0 0 12px;font-size:13.5px;line-height:1.45;color:var(--muted)}
  .ai-body .name-in{width:100%;margin:0 0 12px}
  .ai-in{display:block;width:100%;min-height:86px;padding:11px 13px;border:1px solid var(--rule-strong);border-radius:12px;background:var(--surface-2);font-size:16px;line-height:1.4;color:var(--ink);resize:vertical}
  .ai-in:focus{outline:none;border-color:var(--chord)}
  .ai-row{display:flex;align-items:center;gap:10px;margin:10px 0 8px}
  .ai-mic{height:36px;padding:0 13px}
  .ai-mic.on{background:var(--beat-soft);color:var(--beat)}
  .ai-tip{font-size:12.5px;color:var(--faint)}
  .ai-ex{display:flex;flex-wrap:wrap;gap:6px}
  .ai-ex .chip{height:30px;padding:0 11px;font-size:13px}
  .ai-reply{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--chord-soft);font-size:14.5px;line-height:1.45;color:var(--ink)}
  .ai-reply.err{background:var(--surface-2);background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
  .bsheet-cancel.busy{opacity:.75}
  .ai-undo{margin-left:4px;padding:0 2px;font-weight:700;color:var(--chord);text-decoration:underline;text-underline-offset:3px}
  .ai-head{position:relative}
  .ai-new{position:absolute;right:14px;top:13px;font-size:13.5px;font-weight:600;color:var(--chord)}
  .ai-log{display:flex;flex-direction:column;gap:8px;max-height:42vh;max-height:42dvh;overflow-y:auto;margin:0 0 12px;padding:2px}
  .ai-msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45}
  .ai-msg.user{align-self:flex-end;background:var(--accent-fill);color:var(--on-accent);border-bottom-right-radius:5px}
  .ai-msg.assistant{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-left-radius:5px}
  .ai-msg.err{color:var(--danger)}
  .ai-msg.pending{color:var(--muted);font-style:italic}
  .ai-text{white-space:pre-wrap;overflow-wrap:anywhere}
  .ai-act{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:7px;padding-top:7px;border-top:.5px solid var(--rule-strong);font-size:13.5px;font-weight:600}
  .ai-act button{font-weight:700;color:var(--chord);text-decoration:underline;text-underline-offset:3px}
  .ai-src{margin-top:6px;font-size:12px;color:var(--muted)}
  .ai-src a{color:var(--chord)}
  .ai-set{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;line-height:1.4;color:var(--muted)}
  .ai-set .btn{flex:none;height:36px}
  /* ---------- score ---------- */
  .sc-set{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .sc-field{display:flex;align-items:center;gap:4px;height:36px;padding:0 6px 0 12px;background:var(--surface-2);border-radius:11px;font-size:13px;color:var(--muted)}
  .sc-field select,.sc-field input{height:30px;border:0;background:none;font-weight:600;font-size:15px;color:var(--ink);padding:0 4px;-webkit-appearance:none;appearance:none;cursor:pointer}
  .sc-field input{width:50px;font-family:var(--mono);text-align:center;-moz-appearance:textfield}
  .sc-field input::-webkit-outer-spin-button,.sc-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .sc-field .slash{color:var(--faint)}
  .sc-parts{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
  .sc-parts::-webkit-scrollbar{display:none}
  .sc-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
  .sc-bar .iconbtn{margin-left:auto;color:var(--muted)}
  .sc-hint{font-size:13px;color:var(--muted)}
  .score{min-height:140px;padding:14px 10px 10px;background:var(--surface);border:.5px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);color:var(--ink);overflow:hidden}
  .score svg{display:block;max-width:100%}
  .score .abcjs-note,.score .abcjs-rest{cursor:pointer}
  .score .sel{color:var(--beat)}
  .sc-note{margin:10px 2px 0;font-size:12.5px;color:var(--faint)}
  .sc-empty h2{margin:6px 0 4px;font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:-.015em}
  .sc-empty p{margin:0 0 16px;color:var(--muted);max-width:52ch}
  .inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .inst{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:11px 13px;border-radius:12px;background:var(--surface);border:.5px solid var(--rule);text-align:left;box-shadow:var(--shadow)}
  .inst b{font-size:15px;font-weight:600}
  .inst span{font-size:12.5px;color:var(--muted)}
  .inst:active{background:var(--chord-soft)}
  .inst-grid.sheet{grid-template-columns:1fr 1fr;gap:0;border-top:.5px solid var(--rule)}
  .inst-grid.sheet .inst{border:0;border-radius:0;box-shadow:none;border-bottom:.5px solid var(--rule);background:none}
  .inst-grid.sheet .inst:nth-child(odd){border-right:.5px solid var(--rule)}
  .bsheet-card{max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px);overflow-y:auto}
  .ed-tools .toggle{height:34px}
  /* note-entry palette: sits in the transport bar */
  .pal{padding:10px 6px 2px;border-bottom:1px solid var(--dock-line)}
  .pal-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:13px;color:var(--dock-mute)}
  .pal-head b{color:var(--dock-ink);font-size:14px}
  .pal-head .sp{flex:1}
  .pal-seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--dock-2)}
  .pal-seg button{height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--dock-mute)}
  .pal-seg button[aria-pressed="true"]{background:var(--dock-3);color:var(--dock-ink)}
  .pal-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
  .pk{flex:1 0 auto;min-width:36px;height:38px;padding:0 8px;border-radius:10px;display:inline-grid;place-items:center;background:var(--dock-2);color:var(--dock-ink);font-size:15px;font-weight:600}
  .pk:active{background:var(--dock-3)}
  .pk[aria-pressed="true"]{background:var(--lcd);color:var(--dock)}
  .pk.done{flex:0 0 auto;height:32px;background:var(--lcd);color:var(--dock);font-size:13px}
  .pk.nav{flex:0 0 auto;width:40px;height:32px}
  body.pal-open .dock-main{display:none}
  .pal{padding-bottom:calc(2px + env(safe-area-inset-bottom,0px))}
  .pk.dot{font-size:22px}
  .pal-oct{min-width:30px;text-align:center;align-self:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--lcd)}
  .kbd{position:relative;height:74px;margin:2px 0 6px}
  .kbd button{position:absolute;top:0}
  .kbd .w{bottom:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;border-radius:0 0 7px 7px;background:#F4F5F7;box-shadow:inset 0 0 0 1px #A9AFB8;color:#6B717C;font-size:11px;font-weight:700}
  .kbd .b{z-index:1;height:52%;border-radius:0 0 5px 5px;background:#191B1F;box-shadow:inset 0 0 0 1px #000}
  .kbd .w:active{background:#FFD48A}
  .kbd .b:active{background:#6B5526}
  .pads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 6px}
  .pad{height:42px;border-radius:10px;background:var(--dock-2);color:var(--dock-ink);font-size:13px;font-weight:600}
  .pad:active{background:var(--lcd);color:var(--dock)}
  body.pal-open .chart-main{padding-bottom:calc(250px + env(safe-area-inset-bottom,0px))}
  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    #scoreOut,#scoreOut *{visibility:visible}
    #scoreOut{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;padding:0;color:#000}
    .dock,.topbar,.toast{display:none!important}
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>

<!-- ======================= library ======================= -->
<section id="screenLib">
  <header class="topbar">

    gear: '<svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
    note: '<svg width="44" height="44" viewBox="0 0 44 44" fill="none"><rect x="8" y="9" width="3" height="26" rx="1.5" fill="currentColor" opacity=".45"/><circle cx="19" cy="22" r="4" fill="var(--beat)"/><rect x="27" y="9" width="3" height="26" rx="1.5" fill="currentColor" opacity=".45"/><rect x="33" y="9" width="5" height="26" rx="1.5" fill="currentColor" opacity=".45"/></svg>'
  };
  $("libMenu").innerHTML = ICON.more;
  $("chartMenu").innerHTML = ICON.more;
  $("libSettings").innerHTML = ICON.gear;
  $("libAi").innerHTML = ICON.sparkle;
  $("chartAi").innerHTML = ICON.sparkle;
  $("folderMenu").innerHTML = ICON.more;

  /* ============================ model ============================ */
  const SECTION_NAMES = ["Intro","Verse","Pre-Chorus","Chorus","Bridge","Solo","Breakdown","Outro"];

  // Instruments for the Score tab. t = written pitch minus concert pitch, in semitones.
  // range = concert MIDI range for auto-written lines.
  const INSTRUMENTS = {
    piano:    { name: "Piano", hint: "Grand staff", clefs: ["treble", "bass"], t: 0, kind: "keys" },
    guitar:   { name: "Guitar", hint: "Treble 8vb", clefs: ["treble-8"], t: 12, kind: "chords" },
    bass:     { name: "Bass guitar", hint: "Bass clef", clefs: ["bass"], t: 12, kind: "bass" },
    drums:    { name: "Drums", hint: "Percussion", clefs: ["perc"], t: 0, kind: "drums" },
    vocals:   { name: "Vocals", hint: "Treble clef", clefs: ["treble"], t: 0, kind: "line", range: [57, 74] },
    violin:   { name: "Violin", hint: "Treble clef", clefs: ["treble"], t: 0, kind: "line", range: [60, 81] },
    viola:    { name: "Viola", hint: "Alto clef", clefs: ["alto"], t: 0, kind: "line", range: [52, 72] },
    cello:    { name: "Cello", hint: "Bass clef", clefs: ["bass"], t: 0, kind: "line", range: [43, 62] },
    flute:    { name: "Flute", hint: "Treble clef", clefs: ["treble"], t: 0, kind: "line", range: [64, 86] },
    clarinet: { name: "Clarinet in B♭", hint: "Treble · B♭", clefs: ["treble"], t: 2, kind: "line", range: [55, 77] },
    altosax:  { name: "Alto sax in E♭", hint: "Treble · E♭", clefs: ["treble"], t: 9, kind: "line", range: [52, 72] },
    tenorsax: { name: "Tenor sax in B♭", hint: "Treble · B♭", clefs: ["treble"], t: 14, kind: "line", range: [46, 66] },
    trumpet:  { name: "Trumpet in B♭", hint: "Treble · B♭", clefs: ["treble"], t: 2, kind: "line", range: [57, 74] },
    horn:     { name: "Horn in F", hint: "Treble · F", clefs: ["treble"], t: 7, kind: "line", range: [50, 69] },
    trombone: { name: "Trombone", hint: "Bass clef", clefs: ["bass"], t: 0, kind: "line", range: [45, 65] }
  };
  const INST_ORDER = Object.keys(INSTRUMENTS);
  const CLEFS = [["treble", "Treble"], ["treble-8", "Treble 8vb"], ["bass", "Bass"], ["alto", "Alto"], ["tenor", "Tenor"], ["perc", "Percussion"]];
  function cleanNotes(n){
    if (!n || typeof n !== "object") return null;
    const out = {};
    let any = false;
    Object.keys(n).forEach((k) => {
      if (!/^[A-Za-z0-9]+\.\d$/.test(k) || !Array.isArray(n[k])) return;
      out[k] = n[k].filter((ev) => ev && Array.isArray(ev.k) && [24, 16, 12, 8, 6, 4, 3, 2, 1].indexOf(+ev.d) !== -1).map((ev) => {
        const e = { k: ev.k.filter((x) => Array.isArray(x) && x.length === 3).map((x) => [clamp(x[0] | 0, 0, 6), clamp(x[1] | 0, 0, 9), clamp(x[2] | 0, -2, 2)]), d: +ev.d };
        if (ev.t) e.t = 1;
        return e;
      });
      any = true;
    });
    return any ? out : null;
  }

  function makeBar(chords, lyric){ return { chords: chords ? chords.slice() : [], lyric: lyric || "" }; }
  function makeSection(name, count){
    const bars = [];
    for (let i = 0; i < (count || 4); i++) bars.push(makeBar());
    return { id: uid(), name: name || "Verse", repeat: 1, bars: bars };
  }
  function blankChart(){
    const now = Date.now();
    return { id: uid(), title: "", artist: "", key: "", bpm: 100, top: 4, bot: 4, barsPerLine: 4,
      sections: [makeSection("Verse", 4)], parts: [], instrumental: false, folderId: "", createdAt: now, updatedAt: now };
  }
  function exampleChart(){
    const c = blankChart();
    c.title = "Example: Blues in C"; c.key = "C"; c.bpm = 114;
    const intro = makeSection("Intro", 4);
    ["C7","C7","G7","C7"].forEach((ch, i) => { intro.bars[i].chords = [ch,"","",""]; });
    const v = makeSection("Verse", 12);
    ["C7","F7","C7","C7","F7","F7","C7","C7","G7","F7","C7","G7"].forEach((ch, i) => { v.bars[i].chords = [ch,"","",""]; });
    v.bars[0].lyric = "Woke up this mornin',"; v.bars[1].lyric = "sun was on the wall";
    v.bars[4].lyric = "Woke up this mornin',"; v.bars[5].lyric = "sun was on the wall";
    v.bars[8].lyric = "Told myself I'd"; v.bars[9].lyric = "answer if it"; v.bars[10].lyric = "called";
    c.sections = [intro, v];
    return c;
  }
  function normalize(c){
    c = c || {};
    if (!c.id || !/^[A-Za-z0-9]+$/.test(String(c.id))) c.id = uid();
    c.sections = (Array.isArray(c.sections) ? c.sections : []).map((s) => ({
      id: s.id || uid(),
      name: s.name || "Section",
      repeat: clamp(parseInt(s.repeat,10) || 1, 1, 16),
      bars: (Array.isArray(s.bars) ? s.bars : []).map((b) => {
        const nb = { chords: Array.isArray(b.chords) ? b.chords.map((x) => String(x == null ? "" : x)) : [], lyric: String(b.lyric || "") };
        const n = cleanNotes(b.n);
        if (n) nb.n = n;
        return nb;
      })
    }));
    if (!c.sections.length) c.sections = [makeSection("Verse", 4)];
    c.sections.forEach((s) => { if (!s.bars.length) s.bars.push(makeBar()); });
    c.bpm = clamp(parseInt(c.bpm,10) || 100, 20, 320);
    c.top = clamp(parseInt(c.top,10) || 4, 1, 12);
    c.bot = [2,4,8].indexOf(parseInt(c.bot,10)) !== -1 ? parseInt(c.bot,10) : 4;
    c.barsPerLine = clamp(parseInt(c.barsPerLine,10) || 4, 1, 8);
    c.title = String(c.title || ""); c.artist = String(c.artist || ""); c.key = String(c.key || "");
    c.folderId = typeof c.folderId === "string" ? c.folderId : "";
    c.instrumental = !!c.instrumental;
    c.parts = (Array.isArray(c.parts) ? c.parts : []).filter((p) => p && INSTRUMENTS[p.inst]).map((p) => ({
      id: /^[A-Za-z0-9]+$/.test(String(p.id)) ? String(p.id) : uid(),
      inst: p.inst,
      clef: CLEFS.some((x) => x[0] === p.clef) ? p.clef : INSTRUMENTS[p.inst].clefs[0]
    }));
    c.createdAt = +c.createdAt || Date.now(); c.updatedAt = +c.updatedAt || c.createdAt;
    return c;
  }

  const beatsPerBar = (c) => c.top;
  const beatSeconds = (c) => (60 / c.bpm) * (4 / c.bot);
  const barCount = (c) => c.sections.reduce((n, s) => n + s.bars.length, 0);
  const chordAt = (bar, i) => String(bar.chords[i] || "").trim();
  function barChordText(bar, beats){
    const out = [];
    for (let i = 0; i < beats; i++){ const ch = chordAt(bar, i); if (ch) out.push(ch); }
    return out.join(" ");
  }
  // One box per bar: "D" fills the bar, "D G" splits it, "D G C D" is one per beat.
  function setBarFromText(bar, text, beats){
    const toks = String(text).trim().split(/\s+/).filter(Boolean).slice(0, beats);
    const arr = [];
    for (let i = 0; i < beats; i++) arr.push("");
    toks.forEach((t, k) => { arr[Math.round(k * beats / toks.length)] = t; });
    bar.chords = arr;
  }
  function barHasChords(bar, beats){
    for (let i = 0; i < beats; i++) if (chordAt(bar, i)) return true;
    return false;
  }

  /* ============================ transposition ============================ */
  const SHARPS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  const FLATS  = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
  const PC = {C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,Fb:4,"E#":5,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11,Cb:11};
  const FLAT_KEYS = ["F","Bb","Eb","Ab","Db","Gb","Cb","Dm","Gm","Cm","Fm","Bbm","Ebm"];
  function shiftRoot(root, n, flats){
    const pc = PC[root];
    if (pc === undefined) return root;
    return (flats ? FLATS : SHARPS)[((pc + n) % 12 + 12) % 12];
  }
  function transposeSymbol(sym, n, flats){
    const s = String(sym).trim();
    if (!s) return s;
    return s.split("/").map((part) => {
      const m = /^([A-G])([#b]?)(.*)$/.exec(part.trim());
      return m ? shiftRoot(m[1] + m[2], n, flats) + m[3] : part;
    }).join("/");
  }
  function preferFlats(keyText, n){
    const k = String(keyText).trim();
    const m = /^([A-G][#b]?)/.exec(k);
    if (!m) return n < 0;
    const shifted = shiftRoot(m[1], n, true);
    const minor = /m\b|minor/i.test(k);
    return FLAT_KEYS.indexOf(shifted + (minor ? "m" : "")) !== -1 || FLAT_KEYS.indexOf(shifted) !== -1;
  }
  function transposeChart(c, n){
    const flats = preferFlats(c.key, n);
    c.sections.forEach((s) => s.bars.forEach((b) => { b.chords = b.chords.map((ch) => transposeSymbol(ch, n, flats)); }));
    const m = /^([A-G][#b]?)(.*)$/.exec(String(c.key).trim());
    if (m) c.key = shiftRoot(m[1], n, flats) + m[2];
    transposeParts(c, n);
  }

  /* ============================ text engine ============================ */
  const pad = (s, n) => s.length >= n ? s : s + " ".repeat(n - s.length);
  function gridLine(bars, c){
    const beats = beatsPerBar(c);
    let cellW = 8;
    bars.forEach((bar) => {
      let need = 0;
      for (let i = 0; i < beats; i++){ const ch = chordAt(bar, i); if (ch) need = Math.max(need, Math.round(i / beats * 8) + ch.length + 1); }
      cellW = Math.max(cellW, need);
    });
    const cells = bars.map((bar) => {
      let s = "";
      for (let i = 0; i < beats; i++){
        const ch = chordAt(bar, i);
        if (!ch) continue;
        let col = Math.round(i / beats * cellW);
        if (s.length && col < s.length + 1) col = s.length + 1;
        s = pad(s, col) + ch;
      }
      return pad(s, cellW);
    });
    return { kind: "grid", text: "| " + cells.join(" | ") + " |" };
  }
  const SILENT_BAR_WIDTH = 3;
  function lyricLines(bars, c){
    const beats = beatsPerBar(c);
    let chordStr = "", lyricStr = "";
    bars.forEach((bar, bi) => {
      const lyric = String(bar.lyric || "").trim();
      const start = lyricStr.length;
      const span = lyric.length || beats * SILENT_BAR_WIDTH;
      for (let i = 0; i < beats; i++){
        const ch = chordAt(bar, i);
        if (!ch) continue;
        let col = start + Math.round(i / beats * span);
        if (chordStr.length && col < chordStr.length + 1) col = chordStr.length + 1;
        chordStr = pad(chordStr, col) + ch;
      }
      if (lyric){ lyricStr += lyric; if (bi < bars.length - 1) lyricStr += " "; }
      else lyricStr = pad(lyricStr, Math.max(start + span, chordStr.length + 1));
    });
    const out = [];
    if (chordStr.trim()) out.push({ kind: "chord", text: chordStr.replace(/\s+$/, "") });
    out.push({ kind: "lyric", text: lyricStr.replace(/\s+$/, "") });
    return out;
  }
  function chartBlocks(c, perLine){
    const bpl = Math.max(1, perLine || c.barsPerLine || 4);
    return c.sections.map((s, si) => {
      const rows = [];
      for (let i = 0; i < s.bars.length; i += bpl){
        const bars = s.bars.slice(i, i + bpl);
        const anyLyric = !c.instrumental && bars.some((b) => String(b.lyric || "").trim());
        rows.push({ from: i, to: i + bars.length - 1, lines: anyLyric ? lyricLines(bars, c) : [gridLine(bars, c)] });
      }
      return { si: si, name: s.name || "Section", repeat: s.repeat || 1, rows: rows };
    });
  }
  function factsLine(c){
    const facts = [];
    if (c.key.trim()) facts.push("Key of " + c.key.trim());
    facts.push(c.bpm + " BPM", c.top + "/" + c.bot, barCount(c) + " bars");
    return facts.join(" · ");
  }
  // The seven notes of the song's key, spelled for that key (null if no key is set).
  function keyNotes(c){
    const k = parseKey(c.key);
    if (!c.key.trim() || !k.ok) return null;
    let name, fifths;
    if (KEY_FIFTHS[k.name] !== undefined){ name = k.name; fifths = KEY_FIFTHS[k.name]; }
    else { const e = (k.minor ? MIN_KEY : MAJ_KEY)[k.pc]; name = e[0]; fifths = e[1]; }
    const key = withTonic({ name: name, fifths: fifths, ka: keyAlts(fifths), t: 0 });
    // Triads built on each degree: major I ii iii IV V vi vii°, natural minor i ii° III iv v VI VII.
    const Q = key.minor ? ["m", "°", "", "m", "m", "", ""] : ["", "m", "m", "", "", "m", "°"];
    const RN = key.minor ? ["i", "ii°", "III", "iv", "v", "VI", "VII"] : ["I", "ii", "iii", "IV", "V", "vi", "vii°"];
    const notes = [], chords = [], syms = [];
    for (let i = 0; i < 7; i++){
      const st = (key.tonicStep + i) % 7, a = key.ka[st];
      const n = LETTERS[st] + (a > 0 ? "♯".repeat(a) : "♭".repeat(-a));
      notes.push(n); chords.push(n + Q[i]);
      syms.push(LETTERS[st] + (a > 0 ? "#".repeat(a) : "b".repeat(-a)) + (Q[i] === "°" ? "dim" : Q[i]));
    }
    return { label: pretty(name.replace(/m$/, "")) + (key.minor ? " minor" : " major"), notes: notes, chords: chords, syms: syms, numerals: RN };
  }
  function keyNotesHtml(c){
    const kn = keyNotes(c);
    if (!kn) return "";
    return '<section class="keynotes" aria-label="Chords in ' + esc(kn.label) + '"><div class="bank-head"><b>Chords in ' + esc(kn.label) + '</b><span>Tap one to hear it</span></div><div class="kn-row">' +
      kn.chords.map((ch, i) => '<button class="kn d' + (i + 1) + '" data-sym="' + esc(kn.syms[i]) + '" aria-label="Play ' + esc(ch) + ', chord ' + kn.numerals[i] + '"><b>' + esc(ch) + "</b><small>" + kn.numerals[i] + "</small></button>").join("") + "</div></section>";
  }
  function chartText(c){
    const title = c.title.trim() || "Untitled chart";
    const out = [c.artist.trim() ? title + " — " + c.artist.trim() : title, factsLine(c)];
    const kn = keyNotes(c);
    if (kn) out.push("Chords in " + kn.label + ": " + kn.chords.map((ch, i) => ch + " (" + kn.numerals[i] + ")").join("  "));
    chartBlocks(c).forEach((blk) => {
      out.push("", "[" + blk.name + (blk.repeat > 1 ? " ×" + blk.repeat : "") + "]");
      blk.rows.forEach((r) => r.lines.forEach((l) => out.push(l.text)));
    });
    return out.join("\n").replace(/\s+$/, "") + "\n";
  }
  const fencedText = (c) => "```\n" + chartText(c) + "```\n";

  /* ============================ storage ============================ */

  const STORE_KEY = "barline:charts:v1";

  const folderById = (id) => (id && folders.find((f) => f.id === id)) || null;

  /* ============================ toast + sheets ============================ */

  /* ============================ export ============================ */
  const slug = (s) => String(s || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "chart";
  function saveFile(name, text, mime){
    const url = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();

  }
  // Opens the phone's share sheet (Save to Files, AirDrop, Messages, Obsidian…).
  // Falls back to a plain file download where sharing isn't available.
  async function shareFile(name, text, mime){
    try {
      const file = new File([text], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: name });
        return "shared";
      }
      if (navigator.share && mime.indexOf("text/") === 0){
        await navigator.share({ title: name, text: text });
        return "shared";
      }
    } catch(e){
      if (e && e.name === "AbortError") return "cancelled";
    }
    saveFile(name, text, mime);
    return "saved";
  }

      toast(ok ? "Copied." : "Text selected. Tap Copy on the menu.");

  function backupAll(){

  function importFile(file){
    const reader = new FileReader();

        : (data && Array.isArray(data.sections)) ? [data] : null;
      if (!list){ toast("No charts found in that file."); return; }
      if (data && Array.isArray(data.folders)){
        data.folders.forEach((f) => {
          if (f && f.id && String(f.name || "").trim() && !folderById(String(f.id))){
            const nf = cleanFolder(f);
            if (tombs.folders[nf.id]){ untomb("folders", nf.id); nf.updatedAt = Date.now(); }
            folders.push(nf);
          }
        });
        saveFolders();
      }
      let added = 0, updated = 0, same = 0;
      list.forEach((raw) => {
        if (!raw || !Array.isArray(raw.sections)) return;
        const c = normalize(JSON.parse(JSON.stringify(raw)));
        const have = charts[c.id];
        if (!have){ if (tombs.charts[c.id]){ untomb("charts", c.id); c.updatedAt = Date.now(); } charts[c.id] = c; added++; }
        else if ((c.updatedAt || 0) > (have.updatedAt || 0)){ charts[c.id] = c; updated++; }
        else same++;
      });
      saveNow(); renderLibrary();
      const parts = [];
      if (added) parts.push(added + " added");
      if (updated) parts.push(updated + " updated");
      if (same) parts.push(same + " already here");
      toast(parts.length ? "Imported: " + parts.join(", ") + "." : "No charts found in that file.");
    };
    reader.onerror = () => toast("Couldn't read that file.");
    reader.readAsText(file);
  }

  /* ============================ AI assistant ============================ */
  // A chat assistant: talk or type ("create Wonderwall by Oasis", "add a bridge", "put it in Gigs").
  // Claude works through tools: web search and fetch (run by Anthropic) to look songs up, and
  // list/get/create/update/move tools that this page runs against the library, each change with Undo.
  // Requests go straight from this device to Anthropic's API with the musician's own API key, kept in
  // this browser only (never in backups or sync).
  const AI_KEY = "barline:aiKey";
  const AI_MODEL = "claude-opus-5-5";
  // The key is shared by every tool in Music (shared/ai.js); Barline's own name for it is the fallback.
  const aiKey = () => (self.MusicAI ? self.MusicAI.key() : "") || store.get(AI_KEY, "") || "";
  const AI_SYSTEM = [
    "You are the assistant inside Barline, a chord-chart app for working musicians. The musician talks to you on their phone, often by dictation, so read speech-to-text slips as a musician would (\"see major\" is C major, \"be flat\" is B flat, \"for four\" is 4/4).",
    "You can see and change their library with tools: list_charts, get_chart, create_chart, update_chart and move_chart. Do what they ask without asking for confirmation first; every change you make is shown to them with an Undo button.",
    "",
    "Creating a song from its name: search the web for its key, tempo (BPM), time signature, chord progression and structure (intro, verse, chorus, bridge and so on, with bar counts and repeats), and use web_fetch to read the most useful pages. Then call create_chart once with what you found. Fill in the artist. If sources disagree, go with the most reliable ones. If you can't find something, make a sensible musical choice and say which details are guesses.",
    "Editing: call get_chart first, then update_chart with the complete chart. Keep everything they didn't ask to change exactly as it is. Each message starts with a note in square brackets saying what's on their screen; \"this song\" means the open chart.",
    "",
    "Chart fields:",
    "- key: like \"C\", \"F#m\", \"Bb\", or \"\" if unknown. bpm: 20 to 320. Time signature: top (beats per bar, 1 to 12) over bot (2, 4 or 8).",
    "- sections: in playing order, each with a name (Intro, Verse, Pre-Chorus, Chorus, Bridge, Solo, Outro and so on) and repeat, the number of times it plays in a row (1 if once).",
    "- bars: one entry per bar. chords lists the chords in that bar in order: one chord fills the bar, two split it in half. For exact placement give exactly one entry per beat, using \"\" where the previous chord keeps sounding. An empty list means the chord from before carries on.",
    "- Chord symbols use standard spelling: C, Am, F#m7b5, Bbmaj7, G/B, Dsus4, E7#9, C6/9, N.C.",
    "- lyric: words sung in that bar, only when the musician gives you the words. Never write out the lyrics of published songs, even if you find them online; leave lyric empty.",
    "- instrumental: true for songs with no vocals.",
    "- folder (create_chart): a folder name to file the chart in, or \"\" for none. If the note says they're looking at a folder, use it unless they say otherwise.",
    "",
    "Reply in one to three short, plain sentences: what you did and anything worth double-checking. No headings, lists or markdown."
  ].join("\n");
  const CHART_PROPS = {
    title: { type: "string" },
    artist: { type: "string" },
    key: { type: "string" },
    bpm: { type: "integer" },
    top: { type: "integer" },
    bot: { type: "integer", enum: [2, 4, 8] },
    instrumental: { type: "boolean" },
    sections: {
      type: "array",
      items: {
        type: "object",
        properties: {
          name: { type: "string" },
          repeat: { type: "integer" },
          bars: {
            type: "array",
            items: {
              type: "object",
              properties: { chords: { type: "array", items: { type: "string" } }, lyric: { type: "string" } },
              required: ["chords", "lyric"],
              additionalProperties: false
            }
          }
        },
        required: ["name", "repeat", "bars"],
        additionalProperties: false
      }
    }
  };
  const CHART_REQ = Object.keys(CHART_PROPS);
  const objSchema = (props, req) => ({ type: "object", properties: props, required: req, additionalProperties: false });
  const AI_TOOLS = [
    { name: "list_charts", description: "List every chart in the musician's library: id, title, artist, key, tempo, time signature and folder.", input_schema: objSchema({}, []), strict: true },
    { name: "get_chart", description: "Read one chart in full: settings, sections, bars, chords and lyrics.", input_schema: objSchema({ chart_id: { type: "string" } }, ["chart_id"]), strict: true },
    { name: "create_chart", description: "Create a new chart in the library from complete contents. Returns the new chart's id.", input_schema: objSchema(Object.assign({}, CHART_PROPS, { folder: { type: "string" } }), CHART_REQ.concat(["folder"])), strict: true },
    { name: "update_chart", description: "Replace an existing chart's contents with the complete chart given. Read it with get_chart first and keep what wasn't asked to change.", input_schema: objSchema(Object.assign({ chart_id: { type: "string" } }, CHART_PROPS), ["chart_id"].concat(CHART_REQ)), strict: true },
    { name: "move_chart", description: "File a chart in a folder by name (the folder is created if it doesn't exist), or pass an empty folder to take it out of its folder.", input_schema: objSchema({ chart_id: { type: "string" }, folder: { type: "string" } }, ["chart_id", "folder"]), strict: true },
    { type: "web_search_20260209", name: "web_search", max_uses: 8 },
    { type: "web_fetch_20260209", name: "web_fetch", max_uses: 6 }
  ];
  function aiChartJson(c){
    return JSON.stringify({
      title: c.title, artist: c.artist, key: c.key, bpm: c.bpm, top: c.top, bot: c.bot, instrumental: c.instrumental,
      folder: (folderById(c.folderId) || {}).name || "",
      sections: c.sections.map((s) => ({
        name: s.name, repeat: s.repeat || 1,
        bars: s.bars.map((b) => {
          const ch = [];
          for (let i = 0; i < c.top; i++) ch.push(chordAt(b, i));
          return { chords: ch.some(Boolean) ? ch : [], lyric: c.instrumental ? "" : (b.lyric || "") };
        })
      }))
    });
  }
  class AiError extends Error {}
  async function callClaude(messages, signal){
    const send = (withFallback) => {
      const headers = {
        "content-type": "application/json",
        "x-api-key": aiKey(),
        "anthropic-version": "2026-10-21",
        "anthropic-dangerous-direct-browser-access": "true"
      };
      const body = {
        model: AI_MODEL,
        max_tokens: 16000,
        system: AI_SYSTEM,
        tools: chat.noWeb ? AI_TOOLS.filter((t) => !t.type) : AI_TOOLS,
        output_config: { effort: "medium" },
        messages: messages
      };
      // If a request is declined by a safety check, let Anthropic retry it on a suitable model.
      if (withFallback){ headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; body.fallbacks = "default"; }
      return fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: headers, body: JSON.stringify(body), signal: signal });
    };
    let res;
    try {
      res = await send(!chat.noFallback);
      if (res.status === 400){
        const err = await res.clone().json().catch(() => null);
        const msg = err && err.error && err.error.message || "";
        if (/fallback|anthropic-beta/i.test(msg)){ chat.noFallback = true; res = await send(false); }
        else if (/web_search|web_fetch|web search|web fetch/i.test(msg) && !chat.noWeb){
          // The account hasn't turned on web search: carry on without it and say so.
          chat.noWeb = true; chat.webNote = true;
          res = await send(!chat.noFallback);
        }
      }
    } catch(e){
      if (e && e.name === "AbortError") throw e;
      throw new AiError("Couldn't reach Anthropic. Check your connection and try again.");
    }
    const data = await res.json().catch(() => null);
    if (!res.ok){
      const msg = data && data.error && data.error.message ? data.error.message : "";
      if (res.status === 401) throw new AiError("That API key wasn't accepted. Check it in Settings.");
      if (res.status === 403) throw new AiError("This API key isn't allowed to do that. " + msg);
      if (res.status === 429) throw new AiError("Too many requests for now. Wait a moment and try again.");
      if (res.status === 529 || res.status >= 500) throw new AiError("Claude is busy right now. Try again in a moment.");
      throw new AiError("The request didn't go through" + (msg ? ": " + msg : "."));
    }
    if (!data || !Array.isArray(data.content)) throw new AiError("Got an empty answer. Try again.");
    if (data.stop_reason === "refusal") throw new AiError("Claude couldn't help with that request.");
    return data;
  }

  /* ---------- tools the assistant can use ---------- */
  function aiRerender(id){
    if (state.screen === "lib") renderLibrary();
    else if (!id || id === state.chartId) renderChartScreen();
  }
  function folderNamed(name, create){
    const n = String(name || "").trim().slice(0, 60);
    if (!n) return null;
    let f = folders.find((x) => x.name.toLowerCase() === n.toLowerCase());
    if (!f && create){ f = cleanFolder({ id: uid(), name: n }); folders.push(f); saveFolders(); }
    return f || null;
  }
  const okSections = (inp) => inp && Array.isArray(inp.sections) && inp.sections.length;
  function runTool(name, inp, turn){
    inp = inp || {};
    const fail = (m) => ({ content: m, is_error: true });
    if (name === "list_charts"){
      return { content: JSON.stringify(sortedCharts().slice(0, 300).map((c) => ({
        chart_id: c.id, title: c.title || "Untitled chart", artist: c.artist, key: c.key, bpm: c.bpm, time: c.top + "/" + c.bot,
        folder: (folderById(c.folderId) || {}).name || ""
      }))) };
    }
    if (name === "get_chart"){
      const c = charts[inp.chart_id];
      return c ? { content: aiChartJson(c) } : fail("No chart with id " + inp.chart_id + ". Use list_charts.");
    }
    if (name === "create_chart"){
      if (!okSections(inp)) return fail("A chart needs at least one section.");
      const c = blankChart();
      charts[c.id] = c;
      applyAiChart(c, inp);
      const f = folderNamed(inp.folder, true);
      if (f){ c.folderId = f.id; saveNow(); }
      turn.actions.push({ text: "Created “" + (c.title || "Untitled chart") + "”", id: c.id, undo(){
        delete charts[c.id]; tombstone("charts", c.id); saveNow();
        if (state.chartId === c.id) goLibrary(); else aiRerender();
      } });
      aiRerender(c.id);
      return { content: JSON.stringify({ chart_id: c.id }) };
    }
    if (name === "update_chart"){
      const c = charts[inp.chart_id];
      if (!c) return fail("No chart with id " + inp.chart_id + ". Use list_charts.");
      if (!okSections(inp)) return fail("A chart needs at least one section.");
      const snap = applyAiChart(c, inp);
      turn.actions.push({ text: "Updated “" + (c.title || "Untitled chart") + "”", id: c.id, undo(){
        snap.updatedAt = Date.now(); charts[snap.id] = normalize(snap); saveNow(); aiRerender(snap.id);
      } });
      aiRerender(c.id);
      return { content: JSON.stringify({ ok: true }) };
    }
    if (name === "move_chart"){
      const c = charts[inp.chart_id];
      if (!c) return fail("No chart with id " + inp.chart_id + ". Use list_charts.");
      const prev = c.folderId, f = folderNamed(inp.folder, true);
      c.folderId = f ? f.id : ""; c.updatedAt = Date.now(); saveNow();
      turn.actions.push({ text: f ? "Moved “" + (c.title || "Untitled chart") + "” to " + f.name : "Took “" + (c.title || "Untitled chart") + "” out of its folder", id: c.id, undo(){
        const cc = charts[c.id]; if (!cc) return; cc.folderId = prev; cc.updatedAt = Date.now(); saveNow(); aiRerender(c.id);
      } });
      aiRerender(c.id);
      return { content: JSON.stringify({ ok: true, folder: f ? f.name : "" }) };
    }
    return fail("Unknown tool " + name);
  }
  // What's on screen, as a note at the top of each message (the history itself is never edited).
  function aiContext(){
    const c = state.screen === "chart" ? cur() : null;
    const bits = ["Library: " + Object.keys(charts).length + " charts."];
    if (c) bits.push("Open chart: \"" + (c.title || "Untitled chart") + "\" (chart_id " + c.id + ").");
    else if (folderById(prefs.folder)) bits.push("Looking at the folder \"" + folderById(prefs.folder).name + "\".");
    else bits.push("Looking at the whole library.");
    return "[" + bits.join(" ") + "]\n\n";
  }
  async function runAgent(text, signal){
    const start = chat.messages.length;
    const turn = { actions: [], sources: [] };
    chat.messages.push({ role: "user", content: aiContext() + text });
    try {
      for (let step = 0; step < 14; step++){
        const data = await callClaude(chat.messages, signal);
        chat.messages.push({ role: "assistant", content: data.content });
        data.content.forEach((b) => {
          if (b && b.type === "text" && Array.isArray(b.citations)) b.citations.forEach((ci) => {
            if (ci && ci.url && !turn.sources.some((s) => s.url === ci.url)) turn.sources.push({ url: ci.url, title: ci.title || "" });
          });
        });
        if (data.stop_reason === "pause_turn") continue;
        if (data.stop_reason === "tool_use"){
          const results = data.content.filter((b) => b && b.type === "tool_use").map((b) => {
            let r;
            try { r = runTool(b.name, b.input, turn); } catch(e){ r = { content: "That didn't work: " + (e && e.message || e), is_error: true }; }
            return Object.assign({ type: "tool_result", tool_use_id: b.id }, r);
          });
          chat.messages.push({ role: "user", content: results });
          continue;
        }
        let reply = data.content.filter((b) => b && b.type === "text").map((b) => b.text).join("").trim();
        if (data.stop_reason === "max_tokens") reply += (reply ? " " : "") + "(The answer was cut off.)";
        return { text: reply || (turn.actions.length ? "Done." : "I'm not sure what to do with that. Try saying it another way."), actions: turn.actions, sources: turn.sources };
      }
      throw new AiError("That took too many steps. Try a smaller request.");
    } catch(e){
      // Drop this unfinished exchange so the next message starts from a clean history.
      chat.messages.length = start;
      e.actions = turn.actions;
      throw e;
    }
  }

  // Write the model's chart into the real one. Bars keep any sheet music written on them (matched by
  // position), the parts list is untouched, and the whole change is one Undo.
  function applyAiChart(c, r){
    const snap = JSON.parse(JSON.stringify(c));
    const str = (v, n) => String(v == null ? "" : v).slice(0, n || 200);
    c.title = str(r.title).trim(); c.artist = str(r.artist).trim(); c.key = str(r.key, 20).trim();
    c.bpm = clamp(parseInt(r.bpm, 10) || c.bpm, 20, 320);
    c.top = clamp(parseInt(r.top, 10) || c.top, 1, 12);
    c.bot = [2, 4, 8].indexOf(+r.bot) !== -1 ? +r.bot : c.bot;
    c.instrumental = !!r.instrumental;
    const old = c.sections;

  async function gh(path, opts){
    opts = opts || {};

    if (opts.body) headers["Content-Type"] = "application/json";

    if (res.status === 401) throw new SyncError("GitHub didn't accept the sync token. Set up sync again in Settings.", "auth");
    if (res.status === 404) throw new SyncError("Not found on GitHub.", "notfound");

  async function findGist(){

      const g = (list || []).find((x) => x && x.description === GIST_DESC && x.files && x.files[GIST_FILE]);

  async function readGist(id){

  // Merge what's in the gist with what's on this device. Returns what changed on each side.
  function mergeRemote(remote){
    const cutoff = Date.now() - 90 * 864e5;
    const rDel = remote && remote.deleted || {};
    const T = { charts: {}, folders: {} };
    ["charts", "folders"].forEach((k) => {
      [rDel[k] || {}, tombs[k]].forEach((src) => Object.keys(src).forEach((id) => { const t = +src[id] || 0; if (t > (T[k][id] || 0)) T[k][id] = t; }));

    });

      const a = Object.keys(T[k]), b = rDel[k] || {};

      if (!R ? !!win : (!win || +R.updatedAt !== win.updatedAt)) remoteStale = true;

  // A brand-new device only has the untouched example chart. When it joins a gist that already

      ol.innerHTML = "<li>Open GitHub's token page below and sign in.</li><li>Pick an expiration (\"No expiration\" means you won't have to do this again), keep only <b>gist</b> ticked, then tap <b>Generate token</b>.</li><li>Copy the token (it starts with ghp_) and paste it here. Use the same GitHub account on every device.</li>";
      box.appendChild(ol);
      const link = h("a", "btn sync-link", "Open GitHub's token page");
      link.href = TOKEN_URL; link.target = "_blank"; link.rel = "noopener";
      box.appendChild(link);
      const form = h("form", "");
      const input = h("input", "name-in");
      input.type = "password"; input.placeholder = "ghp_…"; input.autocomplete = "off"; input.spellcheck = false;
      input.setAttribute("autocapitalize", "off"); input.setAttribute("aria-label", "GitHub token");
      form.appendChild(input);
      box.appendChild(form);
      box.appendChild(h("p", "ai-note", "The token can only read and write gists, and it stays on this device. A secret gist isn't listed on your profile or in search, but anyone who has its link can open it."));
      card.appendChild(box);
      body.appendChild(card);
      const go = h("button", "bsheet-cancel pri", "Connect");
      go.type = "button";
      const submit = async () => {
        const v = input.value.trim();
        if (!/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(v)){ toast("That doesn't look like a GitHub token (they start with ghp_ or github_pat_)."); input.focus(); return; }
        go.textContent = "Connecting…"; go.disabled = true;
        try {
          const me = await gh("/user", { token: v });
          store.set(GH_KEY, v);
          store.set(GH_USER, me && me.login ? String(me.login) : "");
          store.set(GIST_KEY, "");
          // A brand-new device only has the untouched example chart; don't copy it to every device.
          const ids = Object.keys(charts);
          if (ids.length === 1 && charts[ids[0]].title === "Example: Blues in C" && charts[ids[0]].updatedAt === charts[ids[0]].createdAt){
            const remoteId = await findGist();
            if (remoteId){ delete charts[ids[0]]; sync.applying = true; saveNow(); sync.applying = false; }
          }
          closeSheet();
          await syncNow();
          if (sync.status === "ok"){ renderLibrary(); toast("Sync is on" + (me && me.login ? " for " + me.login : "") + "."); }
        } catch(e){
          go.textContent = "Connect"; go.disabled = false;
          toast(e instanceof SyncError ? e.message : "Couldn't connect to GitHub.");
        }
      };
      form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
      go.addEventListener("click", submit);
      const cancel = h("button", "bsheet-cancel", "Cancel");
      cancel.addEventListener("click", closeSheet);
      body.appendChild(go); body.appendChild(cancel);

  /* ============================ routing ============================ */

  /* ============================ library ============================ */
  function relTime(ts){
    if (!ts) return "";
    const s = (Date.now() - ts) / 1000;
    if (s < 60) return "now";
    if (s < 3600) return Math.floor(s / 60) + "m";
    if (s < 86400) return Math.floor(s / 3600) + "h";
    if (s < 604800) return Math.floor(s / 86400) + "d";
    return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function peekHtml(c){
    const s = c.sections[0];
    if (!s) return "";
    const bars = s.bars.slice(0, 4).map((b) => esc(barChordText(b, c.top) || "·"));
    return '<span class="bl">|</span> ' + bars.join(' <span class="bl">|</span> ') + ' <span class="bl">|</span>';
  }
  // The badge on each library row: the key if set, else the first chord's root.
  function artLabel(c){
    const k = c.key.trim();
    if (k) return k.replace(/\s*(major|maj)$/i, "").replace(/\s*minor$/i, "m").slice(0, 3);
    for (const s of c.sections) for (const b of s.bars) for (let i = 0; i < c.top; i++){
      const m = /^[A-G][#b]?m?(?!aj)/.exec(chordAt(b, i));
      if (m) return m[0];
    }
    return "\u266A";
  }

    } else {

        open.appendChild(txt);

  /* ---------- install prompt ---------- */

  /* ---------- editor ---------- */
  function stepper(label, value, onStep, aria){
    const box = h("div", "stepper");

    const minus = h("button", "", "−"); minus.setAttribute("aria-label", "Fewer " + aria);
