<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice Log</title>
<!-- The Practice Log is the Calendar tab's Activity view now (calendar/app.js). This page only
     forwards old links there: log/ to ../#activity, log/#day=2026-11-21 to that day. -->
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<script>
  (function () {
    var day = /^#day=(\d{4}-\d\d-\d\d)$/.exec(location.hash);
    location.replace("../#activity" + (day ? "=" + day[1] : ""));
  })();
</script>
</head>
<body>
<p><a href="../#activity">Open the Calendar</a></p>
</body>
</html>
