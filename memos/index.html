<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Memos</title>
<meta name="description" content="Record yourself playing and listen back. Works offline.">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<!-- Voice Memos is one of the apps inside Music, so it installs and works offline through the files one folder up. -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script src="../shared/settings.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="bar">
  <div class="bar-in wrap">
    <a class="icon-btn" id="nav" href="../" aria-label="Music home, all apps"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.500 9.200 10 3.600l6.500 5.600"/><path d="M5.200 8.200v7.300h9.600V8.200"/></svg></a>
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><style>.mlt{fill:#fff;stroke:rgb(20 24 44/.1);stroke-width:8}.mll{stroke:#D9483B}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mlt{fill:#000;stroke:rgb(255 255 255/.14)}:root:not([data-theme="light"]) .mll{stroke:#E47F76}}:root[data-theme="dark"] .mlt{fill:#000;stroke:rgb(255 255 255/.14)}:root[data-theme="dark"] .mll{stroke:#E47F76}</style><rect class="mlt" x="4" y="4" width="504" height="504" rx="110"/><g class="mll" transform="translate(107.5 107.5) scale(12.04)" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5v4M8.5 21.5h7"/></g></svg>
    <h1 class="brand">Voice Memos</h1>
    <button class="icon-btn" id="ai-btn" type="button" data-assistant aria-label="Assistant" style="margin-left:auto"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5l1.7 4.8 4.8 1.7-4.8 1.7L9 15.5l-1.7-4.8L2.5 9l4.8-1.7z"/><path d="M15.5 12.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></svg></button>
  </div>
</header>

<main class="wrap" id="view">
  <div class="col">
    <ul class="list" id="list" aria-label="Recordings"></ul>
    <p class="empty" id="empty" hidden>No recordings</p>
  </div>
</main>

<footer class="dock" id="dock">
  <div class="dock-in col">
    <p class="err" id="err" role="status" hidden></p>
    <div class="idle" id="idle">
      <button class="rec-btn" id="rec" type="button" aria-label="Record"><span></span></button>
    </div>
    <div class="live" id="live" hidden>
      <div class="live-top">
        <canvas id="meter" aria-hidden="true"></canvas>
        <b class="clock" id="clock" role="timer" aria-label="Elapsed">0:00</b>
      </div>
      <div class="live-ctl">
        <button class="pause-btn" id="pause" type="button" aria-label="Pause"></button>
        <button class="stop-btn" id="stop" type="button" aria-label="Stop and save"><span></span></button>
        <span class="pause-btn ghost" aria-hidden="true"></span>
      </div>
    </div>
  </div>
</footer>
<noscript><p class="wrap">Voice Memos needs JavaScript turned on.</p></noscript>

<script src="../shared/ai.js"></script>
<script src="../shared/assistant.js"></script>
<script src="app.js"></script>
<script>
(function () {
  /* ---------- assistant ---------- */
  if (window.MusicAssistant) MusicAssistant.mount({
    app: "memos", button: document.getElementById("ai-btn"),
    context: function () { return window.__memosContext ? window.__memosContext() : "In Voice Memos."; }
  });

  /* ---------- offline: Music's shared service worker, one folder up ---------- */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("../sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
