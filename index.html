<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Music</title>
<meta name="description" content="Your music tools in one app: chord charts, flashcards and a theory reference. Works offline; everything stays on this device.">
<meta name="theme-color" content="#F1F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="shared/settings.js"></script>
<link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Music home screen: one tile per app, each in that app's own color, with a
   small live look at what's inside it. The page itself stays neutral grey so the
   tiles carry the color. The app list comes from apps.js. */
@font-face{
  font-family:"Big Shoulders Display";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/big-shoulders-display.woff2) format("woff2");
}
:root{
  --paper:#F1F2F5; --surface:#FFFFFF; --ink:#121419; --muted:#5C6370; --rule:#E1E4E9;
  --amber:#F5A93B; --charcoal:#15171B; --focus:#B76A00; --ok:#1F8F4E; --bad:#B3261E;
  --panel:#FFFFFF; --panel-ink:#121419; --panel-muted:#5C6370; --panel-track:#E6E8EE;
  --nailed:#E8B23A; --solid:#7F97B8; --rusty:#D9764C;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --acc-teal:#0F766E; --acc-blue:#1D5BC9; --acc-violet:#6A3DC2; --acc-graphite:#2A2F36;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C0D10; --surface:#17191D; --ink:#ECEEF2; --muted:#A0A6B1; --rule:#262A30; --focus:#F5A93B; --ok:#52CC88; --bad:#FF8A7A;
    --panel:#121419; --panel-ink:#ECEEF2; --panel-muted:#A0A6B1; --panel-track:#2A2E36;
    --acc-teal:#2DD4BF; --acc-blue:#5C9BFF; --acc-violet:#A987FA; --acc-graphite:#E3E6EA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C0D10; --surface:#17191D; --ink:#ECEEF2; --muted:#A0A6B1; --rule:#262A30; --focus:#F5A93B; --ok:#52CC88; --bad:#FF8A7A;
  --panel:#121419; --panel-ink:#ECEEF2; --panel-muted:#A0A6B1; --panel-track:#2A2E36;
  --acc-teal:#2DD4BF; --acc-blue:#5C9BFF; --acc-violet:#A987FA; --acc-graphite:#E3E6EA;
  color-scheme:dark;
}
/* Fade between the home screen and an app instead of a hard page flash. */
@media (prefers-reduced-motion: no-preference){ @view-transition{navigation:auto} }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none !important}

.wrap{width:100%;max-width:64rem;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

/* ---------- top bar ---------- */
.bar{padding-top:env(safe-area-inset-top, 0px)}
.bar-in{display:flex;align-items:center;gap:.65rem;min-height:4rem}
.mark{width:2.25rem;height:2.25rem;border-radius:.6rem;flex:none;display:block}
.wordmark{margin:0 auto 0 0;font:800 2rem/1 var(--display);letter-spacing:.005em}
.get{
  height:2.25rem;padding:0 .9rem;border-radius:999px;background:var(--ink);color:var(--paper);
  font-size:.875rem;font-weight:600;flex:none;
}
.get:active{transform:scale(.96)}
/* sync button: a cloud, with a dot that says how sync is doing */
.cloud,.round{position:relative;width:2.25rem;height:2.25rem;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface);box-shadow:0 0 0 1px var(--rule);color:var(--muted)}
.cloud svg,.round svg{width:1.2rem;height:1.2rem}
.cloud:active,.round:active{transform:scale(.94)}
.round{color:var(--ink)}
.cloud[data-state="on"],.cloud[data-state="syncing"],.cloud[data-state="error"]{color:var(--ink)}
.cloud::after{content:"";position:absolute;top:.05rem;right:.05rem;width:.6rem;height:.6rem;border-radius:50%;box-shadow:0 0 0 2px var(--paper);display:none}
.cloud[data-state="on"]::after{display:block;background:var(--ok)}
.cloud[data-state="error"]::after{display:block;background:var(--bad)}
.cloud[data-state="syncing"]::after{display:block;background:var(--amber)}
@media (prefers-reduced-motion: no-preference){ .cloud[data-state="syncing"]::after{animation:pulse 1s ease-in-out infinite alternate} }
@keyframes pulse{from{opacity:1}to{opacity:.25}}

/* ---------- tiles ----------
   The home screen of a phone: one icon per tool with its name under it, nothing else. */
main{flex:1;padding-top:1rem;padding-bottom:1.5rem}
.tiles{list-style:none;margin:0;padding:0;display:grid;gap:1.5rem .5rem;
  grid-template-columns:repeat(4, minmax(0, 1fr))}
@media (min-width:46rem){ .tiles{grid-template-columns:repeat(auto-fill, minmax(7rem, 1fr));gap:2rem 1rem} }
.tile{display:flex;justify-content:center}
.tile-open{display:flex;flex-direction:column;align-items:center;gap:.5rem;width:100%;max-width:6.5rem;
  text-decoration:none;color:var(--text);-webkit-tap-highlight-color:transparent}
.tile-icon{display:block;width:min(4.25rem, 100%);height:auto;aspect-ratio:1;border-radius:22.5%;
  background:var(--tile);box-shadow:0 1px 2px rgb(20 24 44 / .12), 0 6px 14px -6px rgb(20 24 44 / .28);
  transition:transform .12s ease-out}
@media (min-width:46rem){ .tile-icon{width:5rem} }
.tile-open:active .tile-icon{transform:scale(.92)}
.tile-open:focus-visible{outline:none}
.tile-open:focus-visible .tile-icon{outline:3px solid var(--focus);outline-offset:3px}
.tile-name{font-size:.8125rem;font-weight:600;line-height:1.2;text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- foot ---------- */
.foot{padding-top:.25rem;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom, 0px));display:flex;flex-wrap:wrap;gap:.25rem 1rem;justify-content:space-between;font-size:.8125rem;color:var(--muted)}
.foot p{margin:0}

/* ---------- install sheet ---------- */
dialog{
  width:min(26rem, calc(100vw - 2rem));max-height:calc(100dvh - 2rem);margin:auto;padding:1.25rem 1.25rem 1.125rem;
  border:0;border-radius:1.5rem;background:var(--surface);color:var(--ink);
  box-shadow:0 24px 60px -20px rgb(0 0 0 / .45);
}
dialog::backdrop{background:rgb(10 12 15 / .45)}
@media (max-width:30rem){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:1.5rem 1.5rem 0 0;padding-bottom:calc(1.125rem + env(safe-area-inset-bottom, 0px))}
}
dialog h2{margin:0 0 .75rem;font:800 1.75rem/1 var(--display)}
.steps{margin:0;padding:0;list-style:none;counter-reset:step;display:grid;gap:.7rem}
.steps li{counter-increment:step;display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;align-items:start;font-size:.9375rem;color:var(--muted)}
.steps li::before{content:counter(step);width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:var(--charcoal);font-size:.8125rem;font-weight:700}
.steps b{color:var(--ink);font-weight:600}
.sheet-note{margin:.9rem 0 0;padding-top:.8rem;border-top:1px solid var(--rule);font-size:.875rem;color:var(--muted)}
.sheet-done{display:block;width:100%;height:2.75rem;margin-top:1rem;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600}
/* account sheet */
.acct-form{display:flex;flex-direction:column;gap:.55rem}
.acct-form input{height:2.75rem;padding:0 .9rem;border-radius:.7rem;border:0;box-shadow:inset 0 0 0 1px var(--rule);background:var(--paper);color:var(--ink);font:inherit;min-width:0}
.acct-form input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
/* sync sheet */
.sheet-text{margin:0 0 .9rem;font-size:.9375rem;color:var(--muted)}
.sheet-text b{color:var(--ink);font-weight:600}
.steps a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.token-row{display:flex;gap:.5rem;margin-top:1rem}
.token-row input{flex:1;min-width:0;height:2.75rem;padding:0 .8rem;border-radius:.8rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit}
.token-row button,.sheet-go{height:2.75rem;padding:0 1.1rem;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;flex:none}
.token-row button:disabled,.sheet-go:disabled{opacity:.55}
.sheet-err{margin:.5rem 0 0;font-size:.875rem;color:var(--bad);font-weight:600}
.sync-list{margin:0 0 1rem;padding:0;list-style:none;border-radius:1rem;background:var(--paper)}
.sync-list li{display:flex;align-items:baseline;gap:.75rem;padding:.7rem .9rem;font-size:.9375rem}
.sync-list li + li{border-top:1px solid var(--rule)}
.sync-list b{flex:none;font-weight:600}
.sync-list span{flex:1;min-width:0;text-align:right;color:var(--muted)}
.sync-list span.bad{color:var(--bad)}
.sheet-go{display:block;width:100%}
.sheet-plain{display:block;width:100%;height:2.75rem;margin-top:.5rem;border-radius:999px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.sheet-plain.warn{color:var(--bad)}

/* settings sheet */
#set-sheet{overflow-y:auto;overscroll-behavior:contain}
.set-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 .5rem}
.set-head h2{margin:0}
.set-x{width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:var(--ink)}
.set-x svg{width:1rem;height:1rem}
.set-sec{padding:.85rem 0;border-top:1px solid var(--rule)}
.set-sec:first-of-type{border-top:0}
.set-sec h3{margin:0 0 .55rem;font-size:.8125rem;font-weight:700;color:var(--muted)}
.set-lab{margin:.7rem 0 .4rem;font-size:.875rem;color:var(--muted)}
.set-row{display:flex;align-items:center;gap:.6rem;min-height:2.5rem}
.set-row > span,.set-row > .set-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-btn{height:2.25rem;padding:0 1rem;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:.9375rem;font-weight:600;color:var(--ink);background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);text-decoration:none}
.set-btn.pri{background:var(--ink);color:var(--paper);box-shadow:none}
.set-btn.warn{color:var(--bad)}
.set-btn:disabled{opacity:.55}
.seg{display:flex;gap:.25rem;padding:.25rem;border-radius:999px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{flex:1;height:2.25rem;border-radius:999px;font-size:.9375rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.swatches{display:flex;gap:.5rem}
.swatch{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:.35rem 0;border-radius:.8rem;font-size:.8125rem;color:var(--muted)}
.swatch i{width:2rem;height:2rem;border-radius:50%;background:var(--c);display:block;box-shadow:0 0 0 1px var(--rule)}
.swatch[aria-pressed="true"]{color:var(--ink);font-weight:600}
.swatch[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swatch[data-accent="teal"] i{--c:var(--acc-teal)}
.swatch[data-accent="blue"] i{--c:var(--acc-blue)}
.swatch[data-accent="violet"] i{--c:var(--acc-violet)}
.swatch[data-accent="graphite"] i{--c:var(--acc-graphite)}
.font-prev{margin-top:.5rem;font-size:1.25rem;line-height:1.2}
.font-prev.sans{font-family:var(--ui);font-weight:700}
.font-prev.serif{font-family:Georgia,"Times New Roman",serif;font-weight:600}
.key-form{display:flex;gap:.5rem;margin-top:.5rem}
.key-form input{flex:1;min-width:0;height:2.5rem;padding:0 .8rem;border-radius:.8rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit}
.set-pend{margin-top:.6rem;padding:.7rem .8rem;border-radius:.9rem;background:var(--paper)}
.set-pend .set-row{padding-top:.25rem}
.set-err{margin:.5rem 0 0;font-size:.875rem;color:var(--bad);font-weight:600}
@media (max-width:30rem){ .bar-in{gap:.5rem} }
@media (max-width:22rem){ .bar-in{gap:.35rem} .round,.cloud{width:2rem;height:2rem} .get{padding:0 .7rem} }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in wrap">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="114" fill="#15171B"/><path d="M214 116h84a18 18 0 0 1 17.500 13.800L378 386a18 18 0 0 1-17.500 22.200H151.500A18 18 0 0 1 134 386l62.500-256.200A18 18 0 0 1 214 116z" fill="#F5A93B"/><path d="M256 352 291 172" stroke="#15171B" stroke-width="18" stroke-linecap="round"/><rect x="253" y="210" width="56" height="32" rx="9" transform="rotate(11 281 226)" fill="#15171B"/><circle cx="256" cy="352" r="16" fill="#15171B"/></svg>
    <h1 class="wordmark">Music</h1>
    <button class="round" id="ai-btn" type="button" data-assistant aria-label="Assistant"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5l1.7 4.8 4.8 1.7-4.8 1.7L9 15.5l-1.7-4.8L2.5 9l4.8-1.7z"/><path d="M15.5 12.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></svg></button>
    <button class="round" id="set-btn" type="button" aria-label="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.700 1.800h2.600l.4 1.700 1.300.7 1.600-.6 1.300 2.300-1.300 1.200v1.800l1.300 1.200-1.300 2.300-1.600-.6-1.300.7-.4 1.700H6.700l-.4-1.700-1.300-.7-1.600.6L2.100 11l1.300-1.200V8L2.100 6.800 3.400 4.500l1.600.6 1.300-.7z" fill="none" stroke="currentColor" stroke-width="1.300" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.900" fill="none" stroke="currentColor" stroke-width="1.300"/></svg></button>
    <button class="cloud" id="sync-btn" type="button" data-state="off" aria-label="Sync between devices"></button>
    <button class="get" id="get" type="button" hidden>Install</button>
  </div>
</header>

<main class="wrap">
  <ul class="tiles" id="tiles"></ul>
  <noscript>Music needs JavaScript turned on to list its apps.</noscript>
</main>

<footer class="foot wrap">
  <p id="privacy">Works offline. Your charts and ratings stay on this device.</p>
  <p id="version"></p>
</footer>

<dialog id="sheet" aria-labelledby="sheet-title">
  <h2 id="sheet-title"></h2>
  <ol class="steps" id="sheet-steps"></ol>
  <p class="sheet-note" id="sheet-note"></p>
  <button class="sheet-done" id="sheet-done" type="button">Done</button>
</dialog>

<dialog id="sync-sheet" aria-labelledby="sync-title">
  <h2 id="sync-title"></h2>
  <div id="sync-body"></div>
  <button class="sheet-plain" id="sync-close" type="button">Close</button>
</dialog>

<dialog id="set-sheet" aria-labelledby="set-title">
  <div class="set-head"><h2 id="set-title">Settings</h2><button class="set-x" id="set-close" type="button" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"/></svg></button></div>
  <div id="set-body"></div>
  <input type="file" id="bk-file" accept=".json,application/json" hidden>
</dialog>

<script src="apps.js"></script>
<script src="shared/ai.js"></script>
<script src="shared/assistant.js"></script>
<script src="shared/account.js"></script>
<script src="shared/cloud-config.js"></script>
<script src="shared/cloud.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const REG = self.MUSIC || { version: "", apps: [] };

  // Each app keeps its data in this browser's storage. The home screen only reads it.
  function readJson(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
  }
  const plural = (n, one, many) => n.toLocaleString() + " " + (n === 1 ? one : many);
  function relTime(t) {
    if (!t) return "";
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    if (s < 7 * 86400) return plural(Math.floor(s / 86400), "day", "days") + " ago";
    return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  /* ---------- tiles ---------- */
  function render() {
    const list = $("tiles");
    list.textContent = "";
    REG.apps.forEach((app) => {
      const li = el("li", "tile");
      const open = el("a", "tile-open");
      open.href = app.id + "/";
      const img = el(app.icon ? "img" : "span", "tile-icon");
      img.style.setProperty("--tile", app.color || "#2A2F36");
      if (app.icon) { img.src = app.id + "/" + app.icon; img.alt = ""; img.width = 68; img.height = 68; img.decoding = "async"; }
      open.appendChild(img);
      open.appendChild(el("span", "tile-name", app.name));
      li.appendChild(open);
      list.appendChild(li);
    });
    $("version").textContent = REG.version ? "Music " + REG.version : "";
  }
  render();
  // Coming back from an app (Home button, back gesture) can restore this page as it was; refresh what it shows.
  window.addEventListener("pageshow", (e) => { if (e.persisted) render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  window.addEventListener("storage", render);

  /* ---------- install (Add to Home Screen / Dock) ---------- */
  let installEvt = null;  // Chrome and Edge hand over their install prompt here
  const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  function platform() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "ios";
    if (/Android/.test(ua)) return "android";
    const safari = /Safari\//.test(ua) && !/Chrome\/|Chromium\/|Edg\/|OPR\/|Firefox\//.test(ua);
    if (/Macintosh/.test(ua) && safari) {
      // Add to Dock arrived with Safari 17 on macOS Sonoma. Safari 16 or older cannot do it at all;
      // Safari 17+ on an older macOS shows no Add to Dock either, which the page cannot detect,
      // so that case is covered in the sheet's note.
      const v = +((ua.match(/Version\/(\d+)/) || [])[1] || 0);
      return v && v < 17 ? "mac-old" : "mac-safari";
    }
    if (/Firefox\//.test(ua)) return "firefox";
    if (/Chrome\/|Edg\//.test(ua)) return "chrome";
    return "other";
  }
  const CARRY = "The installed app keeps its own storage, separate from Safari. Turn on sync there (the cloud button on this screen) and your charts and ratings come along.";
  const INSTALL = {
    ios: { title: "Add to Home Screen", steps: [
      "<b>Tap the Share button</b> (the square with an arrow).",
      "<b>Scroll down and tap Add to Home Screen.</b>",
      "<b>Tap Add.</b> Music opens full screen and works offline."], note: CARRY },
    "mac-safari": { title: "Add to Dock", steps: [
      "<b>In the menu bar, choose File, then Add to Dock.</b> Or click the Share button in Safari’s toolbar and choose Add to Dock.",
      "<b>Click Add.</b> Music opens in its own window from the Dock, Launchpad and Spotlight."],
      note: "No Add to Dock in the File menu? It needs macOS Sonoma or later: update macOS, or open this page in Chrome or Edge and use the install icon in the address bar. " + CARRY },
    "mac-old": { title: "Install Music", steps: [
      "<b>Update macOS</b> to Sonoma or later (System Settings, General, Software Update), then choose File, Add to Dock in Safari.",
      "<b>Or open this page in Chrome or Edge</b> and click the install icon at the right end of the address bar."],
      note: "This version of Safari can’t add web apps to the Dock." },
    android: { title: "Install Music", steps: [
      "<b>Open the browser menu</b> (⋮).",
      "<b>Tap Install app</b> or Add to Home screen."], note: "" },
    chrome: { title: "Install Music", steps: [
      "<b>Click the install icon</b> at the right end of the address bar. Or open the ⋮ menu and choose Cast, save and share, then Install page as app.",
      "<b>Click Install.</b> Music opens in its own window and shows up with your other apps."], note: "" },

    body.innerHTML =
      '<section class="set-sec"><h3>Theme</h3>' + seg("theme", THEMES, theme) + "</section>" +
      '<section class="set-sec"><h3>Account</h3><div class="set-row"><span class="set-val" id="set-email">' + escHtml(email) + '</span><button class="set-btn" type="button" id="set-acct">Open</button></div></section>' +
      '<section class="set-sec"><h3>Claude</h3><div class="set-row"><span id="set-keystate">' + (hasKey ? "Key saved" : "No key") + "</span>" +
        (hasKey ? '<button class="set-btn" type="button" id="key-remove">Remove</button>'
          : ui.adding ? "" : '<button class="set-btn" type="button" id="key-add">Add</button>') + "</div>" +
        (!hasKey && ui.adding ? '<form class="key-form" id="key-form" novalidate><input id="set-key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-ant-…" aria-label="Anthropic API key"><button class="set-btn pri" type="submit">Save</button></form>' : "") +
        (ui.keyErr ? '<p class="set-err">' + escHtml(ui.keyErr) + "</p>" : "") + "</section>" +
      '<section class="set-sec"><h3>Barline</h3><div class="set-lab">Accent</div><div class="swatches" role="group" aria-label="Accent">' +
        ACCENTS.map((o) => '<button type="button" class="swatch" data-accent="' + o[0] + '" aria-pressed="' + (o[0] === accent) + '"><i></i>' + o[1] + "</button>").join("") + "</div>" +
        '<div class="set-lab">Title font</div>' + seg("font", FONTS, font) + '<div class="font-prev ' + font + '" id="font-prev" aria-hidden="true">Autumn Leaves</div></section>' +
      '<section class="set-sec"><h3>Ear Training</h3><div class="set-row"><span>Settings</span><a class="set-btn" href="ear/#/settings">Open</a></div></section>' +
      '<section class="set-sec"><h3>Backup</h3><div class="set-row"><span></span><button class="set-btn" type="button" id="bk-export">Export</button><button class="set-btn" type="button" id="bk-import">Import</button></div>' +
        (ui.pend ? '<div class="set-pend"><div class="set-row"><span>' + escHtml((ui.pend.date || "Backup") + " · " + ui.pend.count + (ui.pend.count === 1 ? " item" : " items")) + '</span><button class="set-btn" type="button" id="bk-cancel">Cancel</button><button class="set-btn pri" type="button" id="bk-confirm">Confirm</button></div></div>' : "") +
        (ui.undo && !ui.pend ? '<div class="set-row"><span>' + escHtml(ui.undo.date ? "Before import · " + ui.undo.date : "Before import") + '</span><button class="set-btn warn" type="button" id="bk-undo">Undo import</button></div>' : "") +
        (ui.bkErr ? '<p class="set-err" id="bk-err">' + escHtml(ui.bkErr) + "</p>" : "") + "</section>";
    if ($("set-key")) $("set-key").focus();
  }
  function openSettings() {
    ui.adding = false; ui.keyErr = ""; ui.pend = null; ui.bkErr = ""; ui.undo = null;
    if (setSheet.showModal) { if (!setSheet.open) setSheet.showModal(); } else setSheet.setAttribute("open", "");
    renderSettings();
    undoGet().then((u) => { if (u && u.items) { ui.undo = { date: u.at ? asDate(u.at) : "" }; renderSettings(); } });
  }
  const closeSettings = () => { if (setSheet.close) setSheet.close(); else setSheet.removeAttribute("open"); };
  $("set-btn").addEventListener("click", openSettings);
  $("set-close").addEventListener("click", closeSettings);
  setSheet.addEventListener("click", (e) => {
    if (e.target === setSheet) { closeSettings(); return; }
    const t = e.target.closest("button, a");
    if (!t) return;
    if (t.dataset.theme) { settings && settings.set({ theme: t.dataset.theme }); renderSettings(); return; }
    if (t.dataset.accent) { setBarline({ accent: t.dataset.accent }); renderSettings(); return; }
    if (t.dataset.font) { setBarline({ titleFont: t.dataset.font }); renderSettings(); return; }
    switch (t.id) {
      case "set-acct": closeSettings(); openAccount(); break;
      case "key-add": ui.adding = true; ui.keyErr = ""; renderSettings(); break;
      case "key-remove": if (AI) AI.clearKey(); ui.adding = false; ui.keyErr = ""; renderSettings(); break;
      case "bk-export": exportBackup(); break;
      case "bk-import": ui.bkErr = ""; $("bk-file").value = ""; $("bk-file").click(); break;
      case "bk-cancel": ui.pend = null; renderSettings(); break;
      case "bk-confirm": confirmImport(); break;
      case "bk-undo": undoImport(); break;
    }
  });
  setSheet.addEventListener("submit", (e) => {
    if (e.target.id !== "key-form") return;
    e.preventDefault();
    const v = ($("set-key").value || "").trim();
    if (!AI || !AI.looksRight(v)) { ui.keyErr = "Not a valid key"; $("set-key").blur(); renderSettings(); return; }
    if (!AI.setKey(v)) { ui.keyErr = "Couldn’t save"; renderSettings(); return; }
    ui.adding = false; ui.keyErr = ""; $("set-key").blur(); renderSettings();
  });
  if (settings) settings.onChange(renderSettings);
  window.addEventListener("storage", renderSettings);

  function exportBackup() {
    const items = collect(), now = new Date();
    const data = { format: "music-backup", version: 1, exportedAt: now.toISOString(), app: REG.version || "", items: items };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = "music-backup-" + now.toISOString().slice(0, 10) + ".json"; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  $("bk-file").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data = null;
      try { data = JSON.parse(reader.result); } catch (err) {}
      if (!data || data.format !== "music-backup" || !data.items || typeof data.items !== "object") {
        ui.pend = null; ui.bkErr = "Not a Music backup"; renderSettings(); return;
      }
      const items = {};
      Object.keys(data.items).forEach((k) => { if (inBackup(k) && typeof data.items[k] === "string") items[k] = data.items[k]; });
      ui.bkErr = ""; ui.pend = { items: items, count: Object.keys(items).length, date: asDate(data.exportedAt) };
      renderSettings();
    };
    reader.onerror = () => { ui.bkErr = "Couldn’t read the file"; renderSettings(); };
    reader.readAsText(file);
  });
  async function confirmImport() {
    const pend = ui.pend;
    if (!pend) return;
    try { await undoPut({ at: Date.now(), items: collect() }); }
    catch (e) { ui.bkErr = "Couldn’t save a safety copy"; renderSettings(); return; }
    if (!restore(pend.items)) { ui.bkErr = "Couldn’t write the data"; renderSettings(); return; }
    location.reload();
  }
  async function undoImport() {
    const u = await undoGet();
    if (!u || !u.items) { ui.undo = null; renderSettings(); return; }
    if (!restore(u.items)) { ui.bkErr = "Couldn’t write the data"; renderSettings(); return; }
    await undoDel();
    location.reload();
  }

  /* ---------- assistant ---------- */
  if (self.MusicAssistant) self.MusicAssistant.mount({ app: "home", button: $("ai-btn"), context: () => "On the Music home screen" });

  /* ---------- offline ---------- */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
      // A tool with a worker of its own (School) is started from here too, so it is saved for
      // offline use even before it is first opened.
      REG.apps.filter((app) => app.worker).forEach((app) => {
        navigator.serviceWorker.register(app.id + "/" + app.worker, { scope: app.id + "/" }).catch(() => {});
      });
    });
  }
})();
</script>
</body>
</html>
