<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Music</title>
<meta name="description" content="Your music tools in one app: chord charts, flashcards and a theory reference. Works offline; everything stays on this device.">
<meta name="theme-color" content="#F1F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Music home screen: one tile per app, each in that app's own color, with a
   small live look at what's inside it. The page itself stays neutral grey so the
   tiles carry the color. The app list comes from apps.js. */
@font-face{
  font-family:"Big Shoulders Display";font-style:normal;font-weight:100 900;font-display:swap;
  src:url(fonts/big-shoulders-display.woff2) format("woff2");
}
:root{
  --paper:#F1F2F5; --surface:#FFFFFF; --ink:#121419; --muted:#5C6370; --rule:#E1E4E9;
  --amber:#F5A93B; --charcoal:#15171B; --focus:#B76A00; --ok:#1F8F4E; --bad:#B3261E;
  --panel:#FFFFFF; --panel-ink:#121419; --panel-muted:#5C6370; --panel-track:#E6E8EE;
  --nailed:#E8B23A; --solid:#7F97B8; --rusty:#D9764C;
  --display:"Big Shoulders Display","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,Roboto,"Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0C0D10; --surface:#17191D; --ink:#ECEEF2; --muted:#A0A6B1; --rule:#262A30; --focus:#F5A93B; --ok:#52CC88; --bad:#FF8A7A;
    --panel:#121419; --panel-ink:#ECEEF2; --panel-muted:#A0A6B1; --panel-track:#2A2E36;
    color-scheme:dark;
  }
}
/* Fade between the home screen and an app instead of a hard page flash. */
@media (prefers-reduced-motion: no-preference){ @view-transition{navigation:auto} }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
[hidden]{display:none !important}

.wrap{width:100%;max-width:64rem;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}

/* ---------- top bar ---------- */
.bar{padding-top:env(safe-area-inset-top, 0px)}
.bar-in{display:flex;align-items:center;gap:.65rem;min-height:4rem}
.mark{width:2.25rem;height:2.25rem;border-radius:.6rem;flex:none;display:block}
.wordmark{margin:0 auto 0 0;font:800 2rem/1 var(--display);letter-spacing:.005em}
.get{
  height:2.25rem;padding:0 .9rem;border-radius:999px;background:var(--ink);color:var(--paper);
  font-size:.875rem;font-weight:600;flex:none;
}
.get:active{transform:scale(.96)}
/* sync button: a cloud, with a dot that says how sync is doing */
.cloud{position:relative;width:2.25rem;height:2.25rem;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface);box-shadow:0 0 0 1px var(--rule);color:var(--muted)}
.cloud svg{width:1.2rem;height:1.2rem}
.cloud:active{transform:scale(.94)}
.cloud[data-state="on"],.cloud[data-state="syncing"],.cloud[data-state="error"]{color:var(--ink)}
.cloud::after{content:"";position:absolute;top:.05rem;right:.05rem;width:.6rem;height:.6rem;border-radius:50%;box-shadow:0 0 0 2px var(--paper);display:none}
.cloud[data-state="on"]::after{display:block;background:var(--ok)}
.cloud[data-state="error"]::after{display:block;background:var(--bad)}
.cloud[data-state="syncing"]::after{display:block;background:var(--amber)}
@media (prefers-reduced-motion: no-preference){ .cloud[data-state="syncing"]::after{animation:pulse 1s ease-in-out infinite alternate} }
@keyframes pulse{from{opacity:1}to{opacity:.25}}

/* ---------- tiles ---------- */
main{flex:1;padding-top:.5rem;padding-bottom:1.5rem}
.tiles{list-style:none;margin:0;padding:0;display:grid;gap:.875rem}
@media (min-width:46rem){ .tiles{grid-template-columns:repeat(2, minmax(0, 1fr));gap:1.125rem} }

.tile{
  position:relative;display:flex;flex-direction:column;min-height:17.5rem;
  padding:1.25rem 1.25rem 1.125rem;border-radius:1.75rem;
  background:var(--tile);color:#fff;
  transition:transform .12s ease-out;
}
@media (prefers-color-scheme: dark){ .tile{background:color-mix(in srgb, var(--tile) 86%, #000)} }
.tile:has(.tile-open:active){transform:scale(.985)}
.tile-open{display:block;text-decoration:none;padding-right:4rem}
.tile-open::after{content:"";position:absolute;inset:0;border-radius:inherit}
.tile-open:focus-visible{outline:none}
.tile-open:focus-visible::after{outline:3px solid var(--focus);outline-offset:3px}
.tile-name{display:block;font:800 clamp(3rem, 2.2rem + 4vw, 4rem)/.92 var(--display);letter-spacing:.005em}
.tile-about{display:block;margin-top:.5rem;max-width:22rem;font-size:1rem;line-height:1.35;color:rgb(255 255 255 / .86)}
.tile-icon{
  position:absolute;top:1.25rem;right:1.25rem;width:2.75rem;height:2.75rem;border-radius:.7rem;
  box-shadow:0 0 0 1.5px rgb(255 255 255 / .4);pointer-events:none;
}
.tile-live{margin-top:auto;padding-top:1.25rem}
.tile-count{margin:.7rem .125rem 0;font-size:.875rem;color:rgb(255 255 255 / .86);font-variant-numeric:tabular-nums}

/* The live look inside a tile: a sheet of "paper" on the color field. */
.panel{
  position:relative;display:block;padding:.8rem .9rem;border-radius:1rem;
  background:var(--panel);color:var(--panel-ink);text-decoration:none;
}
a.panel{z-index:1;transition:transform .12s ease-out}
a.panel:active{transform:scale(.98)}
.panel-top{display:flex;align-items:baseline;gap:.75rem}
.panel-label{font-size:.75rem;color:var(--panel-muted)}
.panel-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-time{flex:none;font-size:.8125rem;color:var(--panel-muted)}
.panel-note{margin:0;font-size:.9375rem;color:var(--panel-muted)}
.peek{
  display:block;margin-top:.3rem;font:600 .875rem/1.4 var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis;
  color:var(--tile);
}
.peek .bl{color:var(--panel-muted);font-weight:400;opacity:.6}
@media (prefers-color-scheme: dark){ .peek{color:color-mix(in srgb, var(--tile) 45%, #fff)} }

/* Library: shortcuts back to the last few things looked up. */
.lookups{display:flex;flex-wrap:wrap;gap:.4rem;padding:.7rem}
.lookup{position:relative;z-index:1;height:2.125rem;padding:0 .85rem;border-radius:999px;display:inline-flex;align-items:center;
  background:color-mix(in srgb, var(--tile) 12%, var(--panel));color:var(--panel-ink);font-size:.9375rem;font-weight:600;text-decoration:none;white-space:nowrap}
.lookup:active{transform:scale(.96)}

/* Note Cards: how the rated cards split between nailed, solid and rusty. */
.split{display:flex;height:.625rem;border-radius:999px;overflow:hidden;background:var(--panel-track);gap:2px}
.split i{display:block;min-width:.375rem}
.legend{display:flex;flex-wrap:wrap;gap:.25rem 1rem;margin:.6rem 0 0;padding:0;list-style:none;font-size:.875rem;font-variant-numeric:tabular-nums}
.legend li{display:flex;align-items:center;gap:.4rem}
.legend i{width:.625rem;height:.625rem;border-radius:3px;flex:none}
.legend b{font-weight:600}
.legend span{color:var(--panel-muted)}

/* ---------- foot ---------- */
.foot{padding-top:.25rem;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom, 0px));display:flex;flex-wrap:wrap;gap:.25rem 1rem;justify-content:space-between;font-size:.8125rem;color:var(--muted)}
.foot p{margin:0}

/* ---------- install sheet ---------- */
dialog{
  width:min(26rem, calc(100vw - 2rem));max-height:calc(100dvh - 2rem);margin:auto;padding:1.25rem 1.25rem 1.125rem;
  border:0;border-radius:1.5rem;background:var(--surface);color:var(--ink);
  box-shadow:0 24px 60px -20px rgb(0 0 0 / .45);
}
dialog::backdrop{background:rgb(10 12 15 / .45)}
@media (max-width:30rem){
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:1.5rem 1.5rem 0 0;padding-bottom:calc(1.125rem + env(safe-area-inset-bottom, 0px))}
}
dialog h2{margin:0 0 .75rem;font:800 1.75rem/1 var(--display)}
.steps{margin:0;padding:0;list-style:none;counter-reset:step;display:grid;gap:.7rem}
.steps li{counter-increment:step;display:grid;grid-template-columns:1.6rem 1fr;gap:.6rem;align-items:start;font-size:.9375rem;color:var(--muted)}
.steps li::before{content:counter(step);width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;background:var(--amber);color:var(--charcoal);font-size:.8125rem;font-weight:700}
.steps b{color:var(--ink);font-weight:600}
.sheet-note{margin:.9rem 0 0;padding-top:.8rem;border-top:1px solid var(--rule);font-size:.875rem;color:var(--muted)}
.sheet-done{display:block;width:100%;height:2.75rem;margin-top:1rem;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600}
/* account sheet */
.acct-form{display:flex;flex-direction:column;gap:.55rem}
.acct-form input{height:2.75rem;padding:0 .9rem;border-radius:.7rem;border:0;box-shadow:inset 0 0 0 1px var(--rule);background:var(--paper);color:var(--ink);font:inherit;min-width:0}
.acct-form input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
/* sync sheet */
.sheet-text{margin:0 0 .9rem;font-size:.9375rem;color:var(--muted)}
.sheet-text b{color:var(--ink);font-weight:600}
.steps a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.token-row{display:flex;gap:.5rem;margin-top:1rem}
.token-row input{flex:1;min-width:0;height:2.75rem;padding:0 .8rem;border-radius:.8rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:inherit}
.token-row button,.sheet-go{height:2.75rem;padding:0 1.1rem;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;flex:none}
.token-row button:disabled,.sheet-go:disabled{opacity:.55}
.sheet-err{margin:.5rem 0 0;font-size:.875rem;color:var(--bad);font-weight:600}
.sync-list{margin:0 0 1rem;padding:0;list-style:none;border-radius:1rem;background:var(--paper)}
.sync-list li{display:flex;align-items:baseline;gap:.75rem;padding:.7rem .9rem;font-size:.9375rem}
.sync-list li + li{border-top:1px solid var(--rule)}
.sync-list b{flex:none;font-weight:600}
.sync-list span{flex:1;min-width:0;text-align:right;color:var(--muted)}
.sync-list span.bad{color:var(--bad)}
.sheet-go{display:block;width:100%}
.sheet-plain{display:block;width:100%;height:2.75rem;margin-top:.5rem;border-radius:999px;font-weight:600;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.sheet-plain.warn{color:var(--bad)}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in wrap">
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="114" fill="#15171B"/><path d="M214 116h84a18 18 0 0 1 17.500 13.800L378 386a18 18 0 0 1-17.500 22.200H151.500A18 18 0 0 1 134 386l62.500-256.200A18 18 0 0 1 214 116z" fill="#F5A93B"/><path d="M256 352 291 172" stroke="#15171B" stroke-width="18" stroke-linecap="round"/><rect x="253" y="210" width="56" height="32" rx="9" transform="rotate(11 281 226)" fill="#15171B"/><circle cx="256" cy="352" r="16" fill="#15171B"/></svg>
    <h1 class="wordmark">Music</h1>
    <button class="cloud" id="sync-btn" type="button" data-state="off" aria-label="Sync between devices"></button>
    <button class="get" id="get" type="button" hidden>Install</button>
  </div>
</header>

<main class="wrap">
  <ul class="tiles" id="tiles"></ul>
  <noscript>Music needs JavaScript turned on to list its apps.</noscript>
</main>

<footer class="foot wrap">
  <p id="privacy">Works offline. Your charts and ratings stay on this device.</p>
  <p id="version"></p>
</footer>

<dialog id="sheet" aria-labelledby="sheet-title">
  <h2 id="sheet-title"></h2>
  <ol class="steps" id="sheet-steps"></ol>
  <p class="sheet-note" id="sheet-note"></p>
  <button class="sheet-done" id="sheet-done" type="button">Done</button>
</dialog>

<dialog id="sync-sheet" aria-labelledby="sync-title">
  <h2 id="sync-title"></h2>
  <div id="sync-body"></div>
  <button class="sheet-plain" id="sync-close" type="button">Close</button>
</dialog>

<script src="apps.js"></script>
<script src="shared/account.js"></script>
<script src="shared/cloud-config.js"></script>
<script src="shared/cloud.js"></script>
<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const REG = self.MUSIC || { version: "", apps: [] };

  // Each app keeps its data in this browser's storage. The home screen only reads it.
  function readJson(key) {
    try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
  }
  const plural = (n, one, many) => n.toLocaleString() + " " + (n === 1 ? one : many);
  function relTime(t) {
    if (!t) return "";
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    if (s < 7 * 86400) return plural(Math.floor(s / 86400), "day", "days") + " ago";
    return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  /* ---------- live looks ----------
     Optional, one per app id. Each returns { panel, count } or null to show nothing.
     They read the app's own saved data and never change it. An app with no entry here
     still gets its tile. */
  const LIVE = {
    // Barline: the chart you edited last (tap it to open it) and how many you have.
    barline() {
      const saved = readJson("barline:charts:v1");
      if (saved === null) return { panel: note("Write your first chord chart and it shows up here.") };
      const charts = Object.values(saved || {}).filter((c) => c && c.id)
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      if (!charts.length) return { panel: note("No charts yet. Start one and it shows up here.") };
      const c = charts[0];
      const title = String(c.title || "").trim() || "Untitled chart";
      const panel = el("a", "panel");
      panel.href = "barline/#c-" + encodeURIComponent(c.id);
      panel.setAttribute("aria-label", "Open " + title + " in Barline");
      const top = el("span", "panel-top");
      top.appendChild(el("span", "panel-title", title));
      top.appendChild(el("span", "panel-time", relTime(c.updatedAt)));
      panel.appendChild(top);
      const first = Array.isArray(c.sections) && c.sections[0];
      const bars = first && Array.isArray(first.bars) ? first.bars.slice(0, 4) : [];
      if (bars.length) {
        const peek = el("span", "peek");
        const bar = () => peek.appendChild(el("span", "bl", "|"));
        bar();
        bars.forEach((b) => {
          const chords = (Array.isArray(b.chords) ? b.chords : []).map((x) => String(x || "").trim()).filter(Boolean);
          peek.appendChild(document.createTextNode(" " + (chords.join(" ") || "·") + " "));
          bar();
        });
        panel.appendChild(peek);
      }
      return { panel: panel, count: plural(charts.length, "chart", "charts") };
    },

    // Note Cards: how your rated cards split between nailed, solid and rusty.
    "note-cards"() {
      const saved = readJson("shed-deck:progress:v1") || {};
      const n = { nailed: 0, solid: 0, rusty: 0 };
      Object.keys(saved).forEach((k) => { const e = saved[k]; if (e && n[e.s] !== undefined) n[e.s]++; });
      const rated = n.nailed + n.solid + n.rusty;
      if (!rated) return { panel: note("Rate a few cards and your progress shows up here.") };
      const panel = el("div", "panel");
      const split = el("div", "split");
      split.setAttribute("role", "img");
      split.setAttribute("aria-label", n.nailed + " nailed, " + n.solid + " solid, " + n.rusty + " rusty");
      const legend = el("ul", "legend");
      [["nailed", "Nailed"], ["solid", "Solid"], ["rusty", "Rusty"]].forEach(([id, label]) => {
        if (n[id]) { const seg = el("i"); seg.style.flex = n[id] + " 0 0"; seg.style.background = "var(--" + id + ")"; split.appendChild(seg); }
        const li = el("li");
        const chip = el("i"); chip.style.background = "var(--" + id + ")";
        li.appendChild(chip); li.appendChild(el("b", "", n[id].toLocaleString())); li.appendChild(el("span", "", label));
        legend.appendChild(li);
      });
      panel.appendChild(split); panel.appendChild(legend);
      return { panel: panel, count: plural(rated, "card rated", "cards rated") + " across all decks" };
    }
  };
  // Library: the last few things you looked up, each a shortcut straight back to it.
  LIVE.library = function () {
    const saved = readJson("library:recent:v1");
    const recent = (Array.isArray(saved) ? saved : []).filter((x) => x && typeof x.h === "string" && x.h.indexOf("#/") === 0 && x.t).slice(0, 3);
    if (!recent.length) return { panel: note("Look something up and a shortcut back to it shows up here.") };
    const panel = el("div", "panel lookups");
    recent.forEach((x) => { const a = el("a", "lookup", x.t); a.href = "library/" + x.h; panel.appendChild(a); });
    return { panel: panel, count: "Recently looked up" };
  };
  // School: how many classes you are enrolled in, and the last test you sat.
  LIVE.school = function () {
    const saved = readJson("school:progress");
    if (saved === null) return { panel: note("Enroll in a class and your term shows up here.") };
    const classes = Object.values(saved.classes || {}).filter((c) => c && c.status === "enrolled").length;
    if (!classes) return { panel: note("Enroll in a class and your term shows up here.") };
    const sat = Object.keys(saved.tests || {})
      .map((name) => ({ name: name, last: ((saved.tests[name] || {}).attempts || [])[0] }))
      .filter((t) => t.last && t.last.date)
      .sort((a, b) => String(b.last.date).localeCompare(String(a.last.date)))[0];
    const panel = el("a", "panel");
    panel.href = "school/";
    panel.setAttribute("aria-label", "Open School");
    panel.appendChild(el("p", "panel-note", sat ? sat.name + ": " + sat.last.score_pct + "%" : "Pick up where you left off."));
    return { panel: panel, count: plural(classes, "class enrolled", "classes enrolled") };
  };
  function note(text) { const p = el("div", "panel"); p.appendChild(el("p", "panel-note", text)); return p; }

  /* ---------- tiles ---------- */
  function render() {
    const list = $("tiles");
    list.textContent = "";
    REG.apps.forEach((app) => {
      const li = el("li", "tile");
      li.style.setProperty("--tile", app.color || "#2A2F36");
      const open = el("a", "tile-open");
      open.href = app.id + "/";
      open.appendChild(el("span", "tile-name", app.name));
      if (app.about) open.appendChild(el("span", "tile-about", app.about));
      li.appendChild(open);
      if (app.icon) {
        const img = el("img", "tile-icon");
        img.src = app.id + "/" + app.icon; img.alt = ""; img.width = 44; img.height = 44; img.decoding = "async";
        li.appendChild(img);
      }
      let live = null;
      try { live = LIVE[app.id] ? LIVE[app.id]() : null; } catch (e) { live = null; }
      if (live && live.panel) {
        const box = el("div", "tile-live");
        box.appendChild(live.panel);
        if (live.count) box.appendChild(el("p", "tile-count", live.count));
        li.appendChild(box);
      }
      list.appendChild(li);
    });
    $("version").textContent = REG.version ? "Music " + REG.version : "";
  }
  render();
  // Coming back from an app (Home button, back gesture) can restore this page as it was; refresh what it shows.
  window.addEventListener("pageshow", (e) => { if (e.persisted) render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  window.addEventListener("storage", render);

  /* ---------- install (Add to Home Screen / Dock) ---------- */
  let installEvt = null;  // Chrome and Edge hand over their install prompt here
  const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  function platform() {
    const ua = navigator.userAgent;
    if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "ios";
    if (/Android/.test(ua)) return "android";
    const safari = /Safari\//.test(ua) && !/Chrome\/|Chromium\/|Edg\/|OPR\/|Firefox\//.test(ua);
    if (/Macintosh/.test(ua) && safari) return "mac-safari";
    if (/Firefox\//.test(ua)) return "firefox";
    if (/Chrome\/|Edg\//.test(ua)) return "chrome";
    return "other";
  }
  const CARRY = "The installed app keeps its own storage, separate from Safari. Turn on sync there (the cloud button on this screen) and your charts and ratings come along.";
  const INSTALL = {
    ios: { title: "Add to Home Screen", steps: [
      "<b>Tap the Share button</b> (the square with an arrow).",
      "<b>Scroll down and tap Add to Home Screen.</b>",
      "<b>Tap Add.</b> Music opens full screen and works offline."], note: CARRY },
    "mac-safari": { title: "Add to Dock", steps: [
      "<b>In the menu bar, choose File, then Add to Dock.</b> Or click the Share button in Safari’s toolbar and choose Add to Dock.",
      "<b>Click Add.</b> Music opens in its own window from the Dock, Launchpad and Spotlight."],
      note: "Needs macOS Sonoma or later. " + CARRY },
    android: { title: "Install Music", steps: [
      "<b>Open the browser menu</b> (⋮).",
      "<b>Tap Install app</b> or Add to Home screen."], note: "" },
    chrome: { title: "Install Music", steps: [
      "<b>Click the install icon</b> at the right end of the address bar. Or open the ⋮ menu and choose Cast, save and share, then Install page as app.",
      "<b>Click Install.</b> Music opens in its own window and shows up with your other apps."], note: "" },
    firefox: { title: "Install Music", steps: [
      "<b>Open this page in Safari or Chrome.</b> Firefox can’t install web apps on a computer.",
      "<b>Follow the steps there</b> to add Music to your Dock."], note: "" },
    other: { title: "Install Music", steps: [
      "<b>Open your browser’s menu</b> and look for Install, Add to Dock or Add to Home Screen."], note: "" }
  };
  const sheet = $("sheet");
  function renderInstall() { $("get").hidden = isStandalone(); }
  $("get").addEventListener("click", () => {
    if (installEvt) {
      const ev = installEvt;
      ev.prompt();
      ev.userChoice.finally(() => { installEvt = null; renderInstall(); });
      return;
    }
    const info = INSTALL[platform()];
    $("sheet-title").textContent = info.title;
    $("sheet-steps").innerHTML = info.steps.map((t) => "<li><span>" + t + "</span></li>").join("");
    $("sheet-note").textContent = info.note;
    $("sheet-note").hidden = !info.note;
    if (sheet.showModal) sheet.showModal(); else sheet.setAttribute("open", "");
  });
  $("sheet-done").addEventListener("click", () => { if (sheet.close) sheet.close(); else sheet.removeAttribute("open"); });
  sheet.addEventListener("click", (e) => { if (e.target === sheet && sheet.close) sheet.close(); });
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; renderInstall(); });
  window.addEventListener("appinstalled", () => { installEvt = null; renderInstall(); });
  if (window.matchMedia) {
    const mq = matchMedia("(display-mode: standalone)");
    if (mq.addEventListener) mq.addEventListener("change", renderInstall);
  }
  renderInstall();

  /* ---------- your account, and sync between devices ----------
     One sign-in for the whole of Music (shared/cloud.js): an email and a password. Signed in,
     every tool that syncs keeps its data in that account and does its own merging whenever it is
     open. To sync everything from here, the home screen opens each of those tools out of sight
     for a moment and lets it run its normal sync; a tool marks the time it finished under the key
     apps.js lists as its sync.at.

     Before accounts there was one GitHub connection (shared/account.js), each tool keeping a
     secret gist. A device still connected that way keeps syncing that way until someone signs in
     on it; from then on the account is what the tools use. With no account service configured
     (shared/cloud-config.js left empty) the GitHub connection is all there is, as before. */
  const account = self.MusicAccount;
  const cloud = self.MusicCloud && self.MusicCloud.configured ? self.MusicCloud : null;
  const me = () => (cloud ? cloud.user() : null);
  const ASKED = "music:accountAsked";                 // the sign-in sheet has been offered once on this device
  const acct = { mode: "in", busy: false, err: "", note: "", email: "" };
  const SYNCERS = REG.apps.filter((app) => app.sync && app.sync.at);
  const SYNCED_AT = "music:syncedAt";                  // last time the home screen synced everything
  const TOKEN_URL = "https://github.com/settings/tokens/new?scopes=gist&description=Music%20sync";
  const CLOUD = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.600 12.500h7a2.900 2.900 0 0 0 .5-5.700 4 4 0 0 0-7.700-.7 3.200 3.200 0 0 0 .2 6.400Z" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linejoin="round"/></svg>';
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  const escHtml = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
  const sync = { busy: false, problem: "", tool: {} };  // tool: app id -> "syncing" | "ok" | "failed"
  const syncSheet = $("sync-sheet");

  // Ask GitHub one small question. Tells apart: no connection, a token GitHub rejects, and a token without gist access.
  async function github(path, token) {
    let res;
    try {
      res = await fetch("https://api.github.com" + path, { headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token }, cache: "no-store" });
    } catch (e) { throw { kind: "offline", message: "You’re offline. Sync will pick up when you’re back online." }; }
    if (res.status === 401) throw { kind: "auth", message: "GitHub didn’t accept that token. Check it and try again." };
    if (res.status === 403 || res.status === 429) {
      throw res.headers.get("x-ratelimit-remaining") === "0"
        ? { kind: "rate", message: "GitHub is limiting requests for a while. Try again later." }
        : { kind: "auth", message: "This token can’t use gists. Make one with the gist box ticked." };
    }
    if (!res.ok) throw { kind: "server", message: "GitHub had a problem (" + res.status + "). Try again later." };
    return res.json();
  }

  // Open one tool out of sight and wait for it to finish its own sync.
  function syncTool(app) {
    return new Promise((resolve) => {
      const started = Date.now();
      const frame = document.createElement("iframe");
      frame.setAttribute("aria-hidden", "true"); frame.tabIndex = -1; frame.title = app.name + " sync";
      frame.style.cssText = "position:absolute;width:0;height:0;border:0;visibility:hidden";
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true; clearInterval(poll); clearTimeout(limit);
        setTimeout(() => frame.remove(), 300);
        resolve(ok);
      };
      const poll = setInterval(() => { if ((Number(lsGet(app.sync.at)) || 0) >= started) finish(true); }, 250);
      const limit = setTimeout(() => finish(false), 25000);
      frame.src = app.id + "/";
      document.body.appendChild(frame);
    });
  }
  async function syncAll() {
    if (sync.busy || !(me() || account.token()) || !SYNCERS.length) return;
    sync.busy = true; sync.problem = ""; sync.tool = {};
    renderSync();
    try {
      if (!me()) await github("/gists?per_page=1", account.token());
      for (const app of SYNCERS) {
        sync.tool[app.id] = "syncing"; renderSync();
        sync.tool[app.id] = (await syncTool(app)) ? "ok" : "failed";
        renderSync(); render();
      }
      if (SYNCERS.every((app) => sync.tool[app.id] === "ok")) lsSet(SYNCED_AT, String(Date.now()));
      else sync.problem = "Sync didn’t finish for everything. Check your connection and try again.";
    } catch (e) {
      sync.problem = (e && e.message) || "Sync didn’t finish. Try again.";
    }
    sync.busy = false;
    renderSync();
  }
  function toolStatus(app) {
    const st = sync.tool[app.id];
    if (st === "syncing") return ["Syncing…", false];
    if (st === "failed") return ["Didn’t finish", true];
    const at = Number(lsGet(app.sync.at)) || 0;
    return [at ? "Synced " + relTime(at) : (sync.busy ? "Waiting…" : "Not synced yet"), false];
  }
  const toolList = () => '<ul class="sync-list">' + SYNCERS.map((app) => { const s = toolStatus(app); return "<li><b>" + escHtml(app.name) + '</b><span' + (s[1] ? ' class="bad"' : "") + ">" + escHtml(s[0]) + "</span></li>"; }).join("") + "</ul>";
  // The account sheet: sign in, create an account, choose a new password, or see how sync is doing.
  function renderAccount() {
    const user = me(), body = $("sync-body");
    if (cloud.recovering()) {
      if ($("acct-new")) return;
      $("sync-title").textContent = "Choose a new password";
      body.innerHTML =
        '<form class="acct-form" id="acct-form" data-kind="new" novalidate>' +
          '<input id="acct-new" type="password" autocomplete="new-password" placeholder="New password" aria-label="New password">' +
          '<button class="sheet-go" type="submit">Save password</button></form>' +
        '<p class="sheet-err" id="acct-err" hidden></p>';
      return;
    }
    if (user) {
      $("sync-title").textContent = "Your account";
      body.innerHTML =
        '<p class="sheet-text">Signed in as <b>' + escHtml(user.email) + "</b>. Everything you make in Music is saved to your account and follows you to every device you sign in on. Each tool also syncs on its own while you use it.</p>" +
        toolList() +
        (sync.problem ? '<p class="sheet-err">' + escHtml(sync.problem) + "</p>" : "") +
        '<button class="sheet-go" type="button" id="sync-now"' + (sync.busy ? " disabled" : "") + ">" + (sync.busy ? "Syncing…" : "Sync now") + "</button>" +
        '<button class="sheet-plain" type="button" id="acct-out">Sign out</button>';
      return;
    }
    // Don't redraw the form while someone is typing into it.
    if ($("acct-email") && body.dataset.mode === acct.mode && !acct.busy && !acct.err && !acct.note) return;
    const up = acct.mode === "up";
    body.dataset.mode = acct.mode;
    $("sync-title").textContent = up ? "Create your account" : "Sign in to Music";
    body.innerHTML =
      '<p class="sheet-text">One account for all of Music. Your charts, ratings and School progress are saved to it and follow you to every device.</p>' +
      '<form class="acct-form" id="acct-form" data-kind="' + (up ? "up" : "in") + '" novalidate>' +
        '<input id="acct-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Email" aria-label="Email" value="' + escHtml(acct.email) + '">' +
        '<input id="acct-pw" type="password" autocomplete="' + (up ? "new-password" : "current-password") + '" placeholder="Password" aria-label="Password">' +
        '<button class="sheet-go" type="submit"' + (acct.busy ? " disabled" : "") + ">" + (acct.busy ? "One moment…" : up ? "Create account" : "Sign in") + "</button></form>" +
      (acct.err ? '<p class="sheet-err">' + escHtml(acct.err) + "</p>" : "") +
      (acct.note ? '<p class="sheet-text" style="margin-top:.7rem">' + escHtml(acct.note) + "</p>" : "") +
      (up ? '<button class="sheet-plain" type="button" data-acct-mode="in">I already have an account</button>'
          : '<button class="sheet-plain" type="button" data-acct-mode="up">Create an account</button>' +
            '<button class="sheet-plain" type="button" id="acct-reset">Forgot password</button>') +
      '<p class="sheet-note">' + (account.token()
        ? "This device is syncing through GitHub for now. Once you sign in, your tools sync through your account instead; what is on this device comes with you."
        : "Without an account everything still works, and stays on this device.") + "</p>";
    acct.err = ""; acct.note = "";
  }
  async function acctSubmit(kind) {
    const val = (id) => (($(id) || {}).value || "");
    try {
      if (kind === "new") {
        if (val("acct-new").length < 8) throw new Error("Use a password of at least 8 characters.");
        await cloud.setPassword(val("acct-new"));
        $("sync-body").textContent = ""; renderSync(); return;
      }
      acct.email = val("acct-email").trim();
      if (!/^\S+@\S+\.\S+$/.test(acct.email)) throw new Error("Enter your email address.");
      if (kind !== "reset" && val("acct-pw").length < 8) throw new Error("Use a password of at least 8 characters.");
      const pw = val("acct-pw");
      acct.busy = true; renderSync();
      if (kind === "reset") { await cloud.resetPassword(acct.email); acct.note = "A link to choose a new password is on its way to " + acct.email + "."; }
      else if (kind === "up") {
        const r = await cloud.signUp(acct.email, pw);
        if (r.confirm) { acct.mode = "in"; acct.note = "Almost there. Open the link in the email sent to " + acct.email + ", then sign in here."; }
      } else await cloud.signIn(acct.email, pw);
    } catch (e) {
      if (kind === "new") { const el = $("acct-err"); if (el) { el.hidden = false; el.textContent = (e && e.message) || "That didn’t work."; } return; }
      acct.err = (e && e.message) || "That didn’t work.";
    }
    acct.busy = false;
    $("sync-body").dataset.mode = "";
    renderSync();
  }
  function renderSync() {
    const on = !!(me() || account.token()), btn = $("sync-btn");
    btn.dataset.state = !on ? "off" : sync.busy ? "syncing" : sync.problem ? "error" : "on";
    const what = cloud ? "Account and sync" : "Sync between devices";
    btn.setAttribute("aria-label", !on ? what + ": off" : sync.busy ? what + ": syncing" : sync.problem ? what + ": needs attention" : what + ": on");
    $("privacy").textContent = me() ? "Works offline. Everything you make is saved to your account."
      : account.token() ? "Works offline. Your charts and ratings sync through your GitHub account."
      : cloud ? "Works offline. Sign in to keep everything on all your devices." : "Works offline. Your charts and ratings stay on this device.";
    if (!syncSheet.open) return;
    if (cloud) { renderAccount(); return; }
    // Don't redraw the form while someone is typing a token into it.
    if (!on && $("token-in")) return;
    if (!on) {
      $("sync-title").textContent = "Sync between devices";
      $("sync-body").innerHTML =
        '<p class="sheet-text">Keep your charts and ratings the same on your phone and computer. Each tool keeps its data in a secret gist on your GitHub account, and each device connects once with a GitHub token.</p>' +
        '<ol class="steps">' +
          '<li><span><b>Open <a href="' + TOKEN_URL + '" target="_blank" rel="noopener">GitHub’s token page</a></b> and sign in.</span></li>' +
          '<li><span><b>Keep only gist ticked</b> and pick an expiration (“No expiration” means you won’t do this again). Tap Generate token.</span></li>' +
          '<li><span><b>Copy the token and paste it here.</b> It starts with ghp_. A token you already use for Barline or Note Cards works too.</span></li>' +
        "</ol>" +
        '<form class="token-row" id="token-form" novalidate><input id="token-in" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ghp_…" aria-label="GitHub token"><button type="submit" id="token-go">Connect</button></form>' +
        '<p class="sheet-err" id="token-err" hidden></p>' +
        '<p class="sheet-note">The token can only read and write gists, and it stays on this device. A secret gist isn’t listed on your profile or in search, but anyone with its link can open it.</p>';
      return;
    }
    const who = account.user();
    $("sync-title").textContent = "Sync is on";
    $("sync-body").innerHTML =
      '<p class="sheet-text">Connected to GitHub' + (who ? " as <b>" + escHtml(who) + "</b>" : "") + ". Each tool also syncs on its own while you use it.</p>" +
      '<ul class="sync-list">' + SYNCERS.map((app) => { const s = toolStatus(app); return "<li><b>" + escHtml(app.name) + '</b><span' + (s[1] ? ' class="bad"' : "") + ">" + escHtml(s[0]) + "</span></li>"; }).join("") + "</ul>" +
      (sync.problem ? '<p class="sheet-err">' + escHtml(sync.problem) + "</p>" : "") +
      '<button class="sheet-go" type="button" id="sync-now"' + (sync.busy ? " disabled" : "") + ">" + (sync.busy ? "Syncing…" : "Sync now") + "</button>" +
      '<button class="sheet-plain warn" type="button" id="sync-off">Turn off sync on this device</button>';
  }
  async function connect() {
    const input = $("token-in"), go = $("token-go"), err = $("token-err");
    const value = input.value.trim();
    const fail = (msg) => { err.hidden = false; err.textContent = msg; go.disabled = false; go.textContent = "Connect"; input.focus(); };
    if (!/^(ghp_|github_pat_|gho_)[A-Za-z0-9_]{20,}$/.test(value)) { fail("That doesn’t look like a GitHub token. They start with ghp_ or github_pat_."); return; }
    go.disabled = true; go.textContent = "Connecting…"; err.hidden = true;
    try {
      const me = await github("/user", value);
      await github("/gists?per_page=1", value);
      account.connect(value, me && me.login ? String(me.login) : "");
      // A new connection may be a different account: let each tool look up its gist again.
      SYNCERS.forEach((app) => { lsSet(app.sync.at, null); if (app.sync.gist) lsSet(app.sync.gist, null); });
      lsSet(SYNCED_AT, null);
      $("sync-body").textContent = "";
      renderSync();
      syncAll();
    } catch (e) { fail((e && e.message) || "Couldn’t connect to GitHub."); }
  }
  function disconnect() {
    account.disconnect();
    SYNCERS.forEach((app) => { lsSet(app.sync.at, null); if (app.sync.gist) lsSet(app.sync.gist, null); });
    lsSet(SYNCED_AT, null);
    sync.problem = ""; sync.tool = {};
    $("sync-body").textContent = "";
    renderSync();
  }
  $("sync-btn").innerHTML = CLOUD;
  $("sync-btn").addEventListener("click", () => {
    $("sync-body").textContent = "";
    if (syncSheet.showModal) syncSheet.showModal(); else syncSheet.setAttribute("open", "");
    renderSync();
  });
  $("sync-close").addEventListener("click", () => { if (syncSheet.close) syncSheet.close(); else syncSheet.removeAttribute("open"); });
  syncSheet.addEventListener("click", (e) => {
    if (e.target === syncSheet && syncSheet.close) { syncSheet.close(); return; }
    const mode = e.target.closest("[data-acct-mode]");
    if (mode) { acct.email = (($("acct-email") || {}).value || "").trim(); acct.mode = mode.dataset.acctMode; acct.err = acct.note = ""; $("sync-body").dataset.mode = ""; renderSync(); return; }
    if (e.target.closest("#acct-reset")) { acctSubmit("reset"); return; }
    if (e.target.closest("#acct-out")) { cloud.signOut().then(() => { sync.problem = ""; sync.tool = {}; $("sync-body").textContent = ""; renderSync(); }); return; }
    if (e.target.closest("#sync-now")) syncAll();
    else if (e.target.closest("#sync-off") && confirm("Turn off sync on this device for all of Music? Your charts and ratings stay here and in your gists.")) disconnect();
  });
  syncSheet.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target.id === "acct-form") acctSubmit(e.target.dataset.kind); else connect();
  });
  syncSheet.addEventListener("input", (e) => { if (e.target.id === "token-in") $("token-err").hidden = true; });
  window.addEventListener("storage", (e) => { if (e.key === account.TOKEN_KEY || e.key === null) renderSync(); });
  window.addEventListener("online", () => { if ((me() || account.token()) && sync.problem) syncAll(); });
  renderSync();
  const openAccount = () => {
    $("sync-body").textContent = "";
    if (syncSheet.showModal) { if (!syncSheet.open) syncSheet.showModal(); } else syncSheet.setAttribute("open", "");
    renderSync();
  };
  if (cloud) {
    // Signing in or out (here, in a tool, or in another tab) changes what every tool syncs with.
    cloud.onChange(() => {
      $("sync-body").textContent = ""; renderSync(); render();
      if (cloud.recovering()) openAccount();
      else if (me()) { lsSet(SYNCED_AT, null); syncAll(); }
    });
    cloud.ready.then(() => {
      renderSync();
      if (cloud.recovering() || location.hash === "#account") { openAccount(); return; }
      // Music is an app with an account: the first time it is opened on a device, offer sign-in
      // once. Closing the sheet is a fine answer; everything works without one.
      if (!me() && !lsGet(ASKED)) { lsSet(ASKED, "1"); openAccount(); }
    });
    window.addEventListener("hashchange", () => { if (location.hash === "#account") openAccount(); });
  }
  // Opening Music syncs everything if that hasn't happened for a while (each tool still syncs itself while open).
  window.addEventListener("load", () => {
    setTimeout(() => {
      if ((me() || account.token()) && navigator.onLine !== false && Date.now() - (Number(lsGet(SYNCED_AT)) || 0) > 10 * 60 * 1000) syncAll();
    }, 900);
  });

  /* ---------- offline ---------- */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
      // A tool with a worker of its own (School) is started from here too, so it is saved for
      // offline use even before it is first opened.
      REG.apps.filter((app) => app.worker).forEach((app) => {
        navigator.serviceWorker.register(app.id + "/" + app.worker, { scope: app.id + "/" }).catch(() => {});
      });
    });
  }
})();
</script>
</body>
</html>
